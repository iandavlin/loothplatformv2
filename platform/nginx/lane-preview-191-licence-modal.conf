# ─── LANE PREVIEW — 191-licence-modal ────────────────────────────────────────
# A URL Ian can click that serves THIS BRANCH's compose form — the corrected
# licence options and the ⓘ that opens the real terms (#191) — on the vhost he is
# already signed into. Installed and removed by tools/preview/lane-preview.sh —
# do not hand-copy this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/191-licence-modal/compose/?type=loothprint
#
# ⚠️ THE EXISTING lane-preview-frontend-compose.conf WOULD NOT DO. It points
# SCRIPT_FILENAME at /var/www/dev/index.php, which loads the SERVE's mu-plugins —
# so it arms the flag but renders MAIN's form. This lane's whole change is inside
# one mu-plugin, so a preview that loads the serve's copy shows nothing at all
# and reads as "the branch does not work".
#
# WHAT MAKES THIS ONE DIFFERENT: SCRIPT_FILENAME is tools/preview/mu-mirror-boot.php
# in the worktree, which defines WPMU_PLUGIN_DIR at a mirror of the serve's
# mu-plugin dir with the one file swapped (tools/preview/mu-mirror.sh) and then
# requires the serve's own index.php. Real WordPress, real DB, real theme, one
# branch file. Nothing on the serve is modified and /compose/ on the real vhost
# is untouched.
#
# BEFORE LOADING THIS URL:
#   bash tools/preview/mu-mirror.sh \
#        /home/ubuntu/worktrees/191-licence-modal/platform/mu-plugins/lg-frontend-compose.php \
#        /home/ubuntu/.lg-preview/191-licence-modal/mu
# The boot shim refuses loudly if that mirror is absent, rather than falling
# through to main.
#
# GATED FOR FREE. The dev2 server block runs
# `if ($loothdev_is_authorized = 0) { return 403; }` at SERVER level, so this
# location inherits it. Not a new unauthenticated surface.
#
# NO NEW FPM POOL. php8.3-fpm-looth-dev is a runtime, not a checkout; it takes
# its target from SCRIPT_FILENAME per request.

location ^~ /preview/191-licence-modal/compose/ {
    # ⚠️ fastcgi.conf, NOT snippets/fastcgi-php.conf — the latter carries
    # `try_files $fastcgi_script_name =404` resolved against the SERVER document
    # root, where /preview/191-licence-modal/compose/ does not exist. It 404s
    # before fastcgi_pass, so PHP is never invoked and it looks exactly like the
    # route being flagged off.
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;

    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/191-licence-modal/tools/preview/mu-mirror-boot.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    # WordPress routes on REQUEST_URI; hand it the real route so lg_fc_route()
    # sees /compose/ and the query it was given.
    fastcgi_param REQUEST_URI     /compose/?$args;
    fastcgi_param QUERY_STRING    $args;

    # The mu-plugin mirror this preview must load. A fastcgi_param is the only
    # thing that can set this — never a query string, never a visitor header —
    # and it lands in $_SERVER only, which is why the shim reads $_SERVER and
    # not getenv().
    fastcgi_param LG_MU_MIRROR    /home/ubuntu/.lg-preview/191-licence-modal/mu;

    # The compose route's own flag, off by default in the tracked config.
    fastcgi_param LG_FC_PREVIEW   1;

    # NO fastcgi_cache — a preview that served a cached copy of the page just
    # asked to be re-rendered would waste the one thing this exists for.
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "191-licence-modal" always;
}

# The bare prefix lands on the loothprint form, so the URL Ian is given is short.
location = /preview/191-licence-modal/ {
    return 302 /preview/191-licence-modal/compose/?type=loothprint;
}
