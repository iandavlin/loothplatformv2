# ─── LANE PREVIEW — featured-members ─────────────────────────────────────────
# A URL Ian can click that serves THIS BRANCH's Hub, on the vhost he is already
# signed into. Installed and removed by tools/preview/lane-preview.sh — do not
# hand-copy this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/featured-members/hub/
#
# Modelled on lane-preview-thread-follow.conf (which itself is modelled on
# lane-preview-account-following.conf); read either first. Same two things are
# load-bearing here too:
#
# ⚠️ `^~` IS LOAD-BEARING. The vhost carries `location ~* \.(…|css|js|…)$`, and a
# REGEX location outranks a plain prefix one. Without `^~` the HTML would come
# from the branch while every stylesheet and script was stolen by that regex and
# served from the document root — an unstyled page that reads as "the branch is
# broken" when the branch is fine. Box trap 6.
#
# GATED FOR FREE. The dev2 server block runs
# `if ($loothdev_is_authorized = 0) { return 403; }` at SERVER level, so every
# location here inherits it. This preview is not a new unauthenticated surface.
#
# NO NEW FPM POOL, NOTHING RE-POINTED. php8.3-fpm-bb-mirror is a runtime, not a
# checkout; it takes its target from SCRIPT_FILENAME per request. Pointing THIS
# location at the worktree changes nothing for /hub/ on the same vhost, which
# keeps serving /srv/bb-mirror -> the serving checkout.

# Bare prefix → the Hub root, so a link that loses its tail still lands.
location = /preview/featured-members/ {
    return 302 /preview/featured-members/hub/;
}

# ⚠️ THE FLAG IS ON **HERE AND ONLY HERE**. LG_HUB_AUTHOR_BANNER_SWAP defaults
# OFF (platform/config/hub-author-banner-swap.php) and stays off for /hub/ and
# for live. A fastcgi_param can only be set by an nginx conf — never by a query
# string — so this cannot be switched on by a visitor. Ian must click the REAL
# fixed page, not a mock, and this is the one place that is true.
location = /preview/featured-members/hub/index.php {
    # ⚠️ fastcgi.conf, NOT snippets/fastcgi-php.conf. The latter carries
    # `try_files $fastcgi_script_name =404`, resolved against the SERVER's
    # document root — /preview/<lane>/... exists in a worktree, not there — so it
    # 404s before nginx ever reaches fastcgi_pass. Copy fastcgi.conf, not the
    # site's default php include (thread-follow's note; cost that lane three
    # reload cycles the first time).
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-bb-mirror.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/featured-members/bb-mirror/web/index.php;
    fastcgi_param LG_HUB_AUTHOR_BANNER_SWAP 1;
    fastcgi_param LG_HUB_AUTHOR_COMMA_FIX 1;
    # The mount the app must believe it is under, or index.php cannot strip the
    # prefix to route and every internal link would jump back out to the real /hub/.
    fastcgi_param LG_BB_MIRROR_PUBLIC_PATH /preview/featured-members/hub;
    fastcgi_param QUERY_STRING $args;
    # NO fastcgi_cache. The hub's own location microcaches anon renders for 60s;
    # a preview that served Ian a cached copy of a page he just asked to be
    # re-rendered would waste the one thing this exists for.
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "featured-members" always;
}

# Branch assets — forums.css / forums.js and anything else under bb-mirror/web.
# MUST be ^~ (see above). Longer prefix than the front controller above, so it wins.
location ^~ /preview/featured-members/hub/ {
    alias /home/ubuntu/worktrees/featured-members/bb-mirror/web/;
    # A preview must never become a way to execute arbitrary PHP out of a worktree.
    location ~ \.php$ { return 403; }
    try_files $uri /preview/featured-members/hub/index.php;
}

# ─── GATE-ONLY: same branch code, flag FORCED OFF ────────────────────────────
# Not a second thing for Ian to click — exists so the gate can assert the OFF
# state against the IDENTICAL commit as the ON state above, instead of
# comparing against main (a different tree entirely, which would conflate
# "flag off" with "code not merged yet").
#
# ⚠️ EXPLICIT =0, NOT AN OMITTED PARAM. The first cut of this location just
# left LG_HUB_AUTHOR_BANNER_SWAP unset, relying on the TRACKED DEFAULT being
# false — which broke the moment keeper flipped that default to true after
# Ian verified the fix (platform/config/hub-author-banner-swap.php's own
# 'enabled' went false -> true mid-session). The OFF preview then silently
# started reporting ON, and a gate run investigating it burned real time on
# a "worker poisoning" theory before the actual cause (a live file changing
# under a running gate) turned up. An override beats a tracked file in the
# read order either way (see lg_hub_author_banner_swap_enabled(), _chrome.php)
# so =0 here is unconditionally OFF regardless of what the default becomes.
location = /preview/featured-members/hub-off/index.php {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-bb-mirror.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/featured-members/bb-mirror/web/index.php;
    fastcgi_param LG_HUB_AUTHOR_BANNER_SWAP 0;
    fastcgi_param LG_HUB_AUTHOR_COMMA_FIX 0;
    fastcgi_param LG_BB_MIRROR_PUBLIC_PATH /preview/featured-members/hub-off;
    fastcgi_param QUERY_STRING $args;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "featured-members-off" always;
}
location ^~ /preview/featured-members/hub-off/ {
    alias /home/ubuntu/worktrees/featured-members/bb-mirror/web/;
    location ~ \.php$ { return 403; }
    try_files $uri /preview/featured-members/hub-off/index.php;
}

# ─── backlog 27 — the archive-icon on /u/<slug>, THIS BRANCH ────────────────
# Same host/cookie reasoning as the whole file. u.php reads slug from
# QUERY_STRING (strangler-profile-app.conf's own shape — no path-segment
# alias), so this mirrors that exactly rather than inventing a second style.
location ~ "^/preview/featured-members/u/([\w\-]+)/?$" {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/featured-members/profile-app/web/u.php;
    fastcgi_param QUERY_STRING    slug=$1&$args;
    fastcgi_param LG_AUTHOR_ARCHIVE_ICON 1;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "featured-members" always;
}

# GATE-ONLY: same branch code, flag left OFF — proves inertness against the
# IDENTICAL commit, same reasoning as hub-off above.
location ~ "^/preview/featured-members/u-off/([\w\-]+)/?$" {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/featured-members/profile-app/web/u.php;
    fastcgi_param QUERY_STRING    slug=$1&$args;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "featured-members-off" always;
}

# ─── the loopback the icon calls, THIS BRANCH ───────────────────────────────
# The REAL production path (not /preview/-scoped): author-activity.php is
# brand new and does not exist anywhere else yet, so adding it here carries
# zero collision risk and is the MOST faithful test — it validates the exact
# path + behaviour that exists after merge, not a preview stand-in. Loopback-
# only, same as it will be for real (strangler-bb-mirror.conf's own copy).
location = /bb-mirror-api/v0/author-activity.php {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-bb-mirror.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/featured-members/bb-mirror/api/v0/author-activity.php;
    fastcgi_param QUERY_STRING $args;
}
