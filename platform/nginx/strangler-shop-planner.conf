# ===== strangler-shop-planner — /shop-layout-planner/ served standalone =====
# Deployed as /etc/nginx/snippets/strangler-shop-planner.conf, a SYMLINK into the
# serving checkout (same as the other strangler snippets on this box — despite what
# strangler-membership.conf's stale header claims about root-owned copies; the
# symlinks are there, verified 2026-07-31). A `git pull` therefore updates the
# CONTENT of an existing snippet, but a NEW snippet still needs its symlink created
# and nginx reloaded. Both steps are in docs/runbooks/deploy-symlink-couplings.md.
#
# WHY: the slug was rendering through `twentytwentyfive`, the stock WordPress theme
# (Ian, 2026-07-31: "it's rendering with the wordpress theme"). This routes it to a
# standalone front controller BEFORE WordPress ever sees the request.
#
# THIS URL IS LIVE AND TAKES ORGANIC GOOGLE TRAFFIC. A redirect, a 404 or a blank
# page here is a member-facing outage. tools/gates/shop-planner-url-gate.sh asserts
# the URL AND its payload; run it with --live before and after.
#
# ROLLBACK: comment out the include in dev2.loothgroup.com.conf and reload. The slug
# falls straight back to the WordPress render of page 68840, which is untouched and
# still published. That is the whole reason 68840 must not be edited or unpublished.

# --- 1. The no-slash form. -----------------------------------------------------
# WordPress 301s /shop-layout-planner -> /shop-layout-planner/ today (measured on
# live), and the slashed form is what Google has indexed. Preserve it exactly:
# dropping this would turn a working 301 into a 404 for every existing inbound link.
# `location =` is an EXACT match, so it cannot shadow /shop-layout-planner.css.
location = /shop-layout-planner {
    return 301 /shop-layout-planner/;
}

# --- 2. The page. --------------------------------------------------------------
# ^~ (prefix-with-caret) is LOAD-BEARING: a regex location outranks a plain prefix
# one, so the vhost's `location ~* \.(…|css|js|…)$` asset regex would otherwise win
# for anything under this path and serve it as a static file.
#
# The TRAILING SLASH is equally deliberate. `^~ /shop-layout-planner` (no slash)
# would also swallow /shop-layout-planner.css — the page's own stylesheet — and
# hand it to PHP. With the slash, the stylesheet stays outside this location and is
# served (and cached) by the asset regex, which is what we want.
location ^~ /shop-layout-planner/ {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;

    # fastcgi.conf sets SCRIPT_FILENAME from $fastcgi_script_name, which for this
    # location is the REQUEST path (…/shop-layout-planner/), not a file. Pin both to
    # the real controller — same override pattern as strangler-membership.conf:57.
    fastcgi_param SCRIPT_FILENAME $document_root/shop-layout-planner.php;
    fastcgi_param SCRIPT_NAME     /shop-layout-planner.php;
    fastcgi_param QUERY_STRING    $args;

    fastcgi_read_timeout 60;
}
