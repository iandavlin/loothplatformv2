# === MAIN VHOST — REPO SOURCE-OF-TRUTH (platform/nginx/dev2.loothgroup.com.conf) ===
# Deployed box-local as /etc/nginx/sites-available/dev2.loothgroup.com.conf.
# SECRETS are NOT in this file: the two dev gate tokens are `include`d from the
# box-local /etc/nginx/snippets/loothdev-tokens.conf (see *.example), and the armed
# gate maps live in the box-local conf.d/loothdev-auth.conf. dev2's per-env values
# (gate-arm line, .dev2 cookie domain) are tracked HERE. NOTE (audit 2026-07-26):
# LIVE currently serves THIS SAME tracked file (dev2→live promotion leftover) — the
# dev2-specific lines are inert there (live's box-local loothdev-auth.conf is the
# gate-free posture whose default-1 no-ops the gate-arm; /claim is vestigial with the
# gate off), and the /pwa.js location self-falls-back if pwa-loader.php is not yet
# linked. Giving live its own vhost name is a cutover-day decision, not a requirement.
# TLS cert paths are the only box-managed literals remaining.
server {
    listen 80;
    listen [::]:80;
    server_name loothgroup.com www.loothgroup.com dev2.loothgroup.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location ^~ /.well-known/ { root /var/www/dev; try_files $uri =404; access_log off; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loothgroup.com www.loothgroup.com dev2.loothgroup.com;
    location = /gatetest { default_type text/plain; return 200 "auth=$loothdev_is_authorized dev_ok=$loothdev_dev_ok tester_ok=$loothdev_tester_ok\n"; }
    ssl_certificate     /etc/letsencrypt/live/dev2.loothgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev2.loothgroup.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Security headers (pre-go-live hardening, Buck F4 2026-06-11). HSTS w/o preload
    # (reversible); no includeSubDomains (no sub-subdomains served here over HTTP).
    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    root /var/www/dev;
    include /etc/nginx/snippets/lg-write-freeze.conf;
    index index.php index.html;

    client_max_body_size 8000M;
    client_body_timeout 6000s;
    send_timeout 6000s;

    # Smart heartbeat — visible-tab mousemove/click/keydown only.
    # Mtime-bumps /var/log/nginx/heartbeat.log which the idle daemon watches.
    sub_filter '</head>' '<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#87986a"><script>(function(){try{var b=JSON.parse(localStorage.getItem("lg-set-boot")||"null");var r=document.documentElement,h=document.head||r;if(b){var v=b.vars||{},k;for(k in v)if(v.hasOwnProperty(k))r.style.setProperty(k,v[k]);if(b.theme)r.setAttribute("data-lguser-theme",b.theme);r.setAttribute("data-lguser-dark",b.dark?"1":"0");if(b.feed)r.setAttribute("data-lguser-feed",b.feed);if(b.font){r.style.setProperty("--lg-font-sans",b.font);r.style.setProperty("--lguser-font",b.font);}if(b.scale)r.style.fontSize=(b.scale*100)+"%";if(b.bubble)r.style.setProperty("--lguser-bubble",b.bubble);if(b.fontHref&&!document.getElementById("lg-boot-font")){var l=document.createElement("link");l.id="lg-boot-font";l.rel="stylesheet";l.href=b.fontHref;h.appendChild(l);}if(b.dark){var bg=b.bg||"#15171a",s=document.createElement("style");s.id="lg-boot-crit";s.textContent="html{background:"+bg+";color-scheme:dark}body{background:"+bg+"!important;color:"+(b.ink||"#e5e7e1")+"!important}.feed-page,.feed,main,.bb-layout,.bb-layout__main{background:"+bg+"!important}#site-header,.lg-chrome{background:#000!important}";h.appendChild(s);}}var hl=localStorage.getItem("lg-hub-layout");if(hl==="cards"||hl==="compact")hl="masonry";if(hl)r.setAttribute("data-lg-hublayout",hl);if(/^\/hub/.test(location.pathname)){r.className+=" lg-feed-booting";setTimeout(function(){r.classList.remove("lg-feed-booting");},1500);}}catch(e){}})();</script><style id="lg-smoothnav">html.lg-feed-booting .feed-page .feed{opacity:0}.feed-page .feed{transition:opacity .15s ease}</style><script src="/pwa.js" defer></script><script>(function(){var t=0;function hb(){if(document.visibilityState==="hidden")return;var n=Date.now();if(n-t<30000)return;t=n;navigator.sendBeacon("/__heartbeat")}["mousemove","click","keydown"].forEach(function(e){document.addEventListener(e,hb,{passive:true})});hb()}())</script><script async src="https://www.googletagmanager.com/gtag/js?id=G-LL56F0GWCH"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-LL56F0GWCH");</script></head>';
    sub_filter_once on;
    sub_filter_types text/html;

    location = /__heartbeat {
        access_log /var/log/nginx/heartbeat.log;
        return 204;
    }

    # PWA service worker must not be pinned by the static catch-all's
    # expires max, or browsers never pick up SW updates.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA install: Chrome fetches the manifest + icons WITHOUT credentials,
    # so they must bypass the cookie gate or the install prompt never fires.
    # Public assets (app name + generic icons) — no secrets.
    location = /manifest.json { try_files $uri =404; }
    # Icons are unversioned URLs — 30d cache (no immutable), perf lane 2026-06-11.
    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # /pwa.js is served by pwa-loader.php (deploy-one-pull 2026-07-26): it prepends
    # window.LG_V = { file: filemtime, … } so every layer URL carries ?v=<filemtime>
    # and a `git pull` busts the immutable asset cache by itself — the version is
    # never hand-carried in this conf again. The loader sends Cache-Control:no-cache
    # + a strong ETag (304 fast path), so the request cost matches the old static
    # no-cache serving.
    # SELF-FALLBACK, deliberately: LIVE serves this same tracked file (promotion
    # leftover — its enabled vhost is named dev2.loothgroup.com.conf), so a live
    # `git pull` picks up this location BEFORE install-symlinks.sh has linked
    # pwa-loader.php into that docroot. try_files degrades to static pwa.js (whose
    # v() fallbacks are designed for exactly that) instead of 404ing the PWA
    # bootstrap site-wide.
    location = /pwa.js {
        try_files /pwa-loader.php @pwa_static;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/pwa-loader.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
    }
    location @pwa_static {
        add_header Cache-Control "no-cache";
        try_files /pwa.js =404;
    }
    location = /shop-feed.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }


    # ----- Cookie gate -----
    # The dev gate tokens (one-time /claim secret + tester secret) are BOX-LOCAL
    # secrets and are NOT committed to the repo. They live in the root-owned, per-box
    # file /etc/nginx/snippets/loothdev-tokens.conf, which `set`s $loothdev_token and
    # $loothdev_tester_token. See platform/nginx/loothdev-tokens.conf.example for the
    # shape. Devs visit /claim?t=TOKEN once per device → 1-year cookie; bots → 403.
    include /etc/nginx/snippets/loothdev-tokens.conf;

    # dev2 gate ARM (per-env line, tracked here because this file is inherently
    # dev2's): $loothdev_is_authorized is computed by the BOX-LOCAL
    # conf.d/loothdev-auth.conf (armed maps + token values live there, never in the
    # repo; the repo's platform/nginx/loothdev-auth.conf is the gate-free posture
    # whose `default 1` makes this line a no-op if ever included elsewhere).
    if ($loothdev_is_authorized = 0) { return 403; }

    location = /claim {
        access_log off;
        if ($arg_t = $loothdev_token) {
            add_header Set-Cookie "loothdev_auth=$loothdev_token; Domain=.dev2.loothgroup.com; Path=/; Max-Age=31536000; HttpOnly; Secure; SameSite=Lax" always;
            add_header Content-Type "text/plain";
            return 200 "Access granted. This device is now claimed for 1 year. Visit https://dev2.loothgroup.com/";
        }
        return 200 "Claim endpoint. Use the URL from Ian.";
    }

    # Tester claim: short-lived (7 day) tester cookie. ?next=<path> redirects post-claim.
    # Separate cookie name (loothdev_tester) so dev cookies are never overwritten.
    location = /claim-tester {
        access_log off;
        if ($arg_t = $loothdev_tester_token) {
            add_header Set-Cookie "loothdev_tester=$loothdev_tester_token; Domain=.dev2.loothgroup.com; Path=/; Max-Age=604800; HttpOnly; Secure; SameSite=Lax" always;
            return 302 $loothdev_tester_next;
        }
        add_header Content-Type "text/plain";
        return 200 "Tester claim endpoint. Use the link from the dev-control plugin.";
    }

    # lane-view — WATCH-ONLY lane terminals for the work board (Ian ruled
    # watch-only 8/15). ttyd on loopback; read-only twice over (no -W, tmux -r);
    # lane names allowlisted by tools/lanes/lane-view.sh. Gated by the same
    # server-wide $loothdev_is_authorized 403 as everything else here. `^~`
    # so the static-asset regex can never steal it (box trap 6).
    location ^~ /lane-view/ {
        proxy_pass http://127.0.0.1:7681/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Mailpit — local SMTP catcher web UI (cookie-gated like the other dev tools)
    location ^~ /mailpit/ {
        # GATE OFF for cut 2026-06-20: if ($cookie_loothdev_auth != $loothdev_token) { return 403; }
        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 86400s;
    }

    # ----- Exempt paths (no cookie required) -----

    # Canonicalize the bare path so /billing still resolves now that the prefix
    # match below requires the trailing slash (see fix note).
    location = /billing { return 301 /billing/; }

    # Stripe billing app + its API endpoints (own X-LGMS-Token + Stripe signature auth)
    # Fix (HK-002 / #40): this was `^~ /billing` with no trailing slash, a literal
    # prefix match that also swallowed unrelated WP page slugs like /billing-refund/
    # and /billing-faq/, routing them into the Slim app instead of WordPress. Slim has
    # no matching route for those, so it 404s — and with APP_DEBUG on, that 404 renders
    # a full stack trace exposing /srv/lg-stripe-billing internals. The trailing slash
    # makes this an exact-directory-boundary prefix, so it only matches /billing/... .
    location ^~ /billing/ {
        alias /srv/lg-stripe-billing/public/;
        try_files $uri $uri/ @billing_rewrite;

        location ~ ^/billing/.*\.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm-lg-billing-dev.sock;
            fastcgi_read_timeout 60;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    location @billing_rewrite {
        rewrite ^/billing/?(.*)$ /billing/index.php?/$1 last;
    }

    # Fix (#22 / #23): /directory and /directory/ 404'd instead of redirecting to the
    # real members directory. No location block for /directory existed at all — this
    # was a missing route, not a broken one.
    location = /directory { return 301 /directory/members/; }
    location = /directory/ { return 301 /directory/members/; }

    # WP↔billing server-to-server callbacks (shared-secret authed)
    # Direct FastCGI pass — skip fastcgi-php.conf snippet because it has a
    # try_files $fastcgi_script_name =404 check that fails for non-.php URIs.
    # We pass to WP's index.php directly and let WP route via REQUEST_URI.
    location ^~ /wp-json/lg-member-sync/ {
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/dev/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
        fastcgi_read_timeout 300;
    }

    location ^~ /wp-json/loothdev/ {
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/dev/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
        fastcgi_read_timeout 300;
    }

    # Internal service channel (poller <-> profile-app, shared-secret auth at PHP layer).
    location ^~ /wp-json/looth-internal/ {
        # Lockdown (Ian 2026-06-03): internal tier channel — localhost only.
        # whoami shim calls via https://127.0.0.1; defense-in-depth atop PHP shared-secret.
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/dev/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
        fastcgi_read_timeout 300;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # Thumbnail editor — has its own basic auth + rate limit on brute force
    location ^~ /thumb/ {
        alias /srv/thumb-app/;
        index editor.html index.php;
        client_max_body_size 60M;

        # Rate limit: 5 requests/minute per IP, allow short bursts of 10
        # Legit users opening the editor hit ~5-20 requests in burst then idle
        # Brute force pounding gets 503'd after burst exhausted
        limit_req zone=loothdev_thumb burst=10 nodelay;
        limit_req_status 429;

        auth_basic           "Thumbnail Editor";
        auth_basic_user_file /srv/thumb-app/.htpasswd;
        location ~ ^/thumb/\. { deny all; return 404; }

        location ~ ^/thumb/(assets|patterns|output)/.*\.php$ {
            return 403;
        }

        location ~ ^/thumb/api/(.*)$ {
            rewrite ^/thumb/api/(.*)$ /thumb/api.php?path=$1 last;
        }

        location ~ ^/thumb/.+\.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
            fastcgi_read_timeout 300;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param REMOTE_USER $remote_user;
        }
    }

    # ----- Lane/dev tooling is NEVER reachable over HTTP (dev-files-exposure 7/31) -----
    # A plugin/mu-plugin tree is served straight off the docroot and the catch-all
    # `location ~ \.php$` at the bottom hands ANY .php under it to FPM. So a lane's
    # dev/ or tests/ directory inside a plugin is EXECUTED by anonymous request the
    # moment it deploys. Measured on this box against the gate-free (live-posture)
    # config, all by unauthenticated GET:
    #   dev/preview/signup-preview.php   booted WordPress and rendered a real page (20KB)
    #   dev/verify-missed-exclusions.php opened a Postgres connection and queried
    #                                    `notifications` — stopped ONLY by a table GRANT
    #   dev/verify-recap-flag-off.php    ran, shell_exec()'d git, printed internals
    #   dev/render-0727-reconstruction.php  eval()'d a file from world-writable /tmp
    #   run-suite.sh, measure-*.sh       served as readable source (22KB)
    #
    # POSITION IS LOAD-BEARING — DO NOT MOVE THIS INTO "Always-deny patterns" BELOW.
    # nginx tries regex locations in ORDER OF APPEARANCE. The always-deny block sits
    # after the static-asset regex, so a deny placed there still loses .css/.js/.svg
    # fixtures to that regex. It must stay above BOTH regexes to cover every
    # extension. (Box trap 6, ordering form.)
    #
    # TWO RULES, because depth and extension pull in opposite directions.
    # (a) ANY depth, but only things that EXECUTE or are script source. A plugin
    #     never legitimately serves .php/.sh over HTTP out of a tests/ or bin/
    #     directory, so this can safely run all the way down — and it has to,
    #     because the bulk of the exposure is vendored PHPUnit suites like
    #     buddyboss-platform/vendor/alchemy/binary-driver/tests/ (which answered,
    #     and fataled inside FPM, i.e. ran) and buddyboss-platform/cli/bin/test.sh
    #     (served as readable source).
    # (b) DIRECTLY under a plugin root, any extension at all. This is what catches
    #     the non-executable fixtures — lg-layout-v2/tests/expected/*/bundle.css,
    #     rendered.html — without matching woocommerce/assets/js/frontend/test/*.js,
    #     which pages actually load. Widening (b) to any depth WOULD break that, so
    #     it stays shallow deliberately; do not "simplify" these into one rule.
    #
    # 404 not 403: 403 confirms the path exists.
    #     `json` is in (a) because vendored suites ship large fixture payloads
    #     (burst-statistics/.../phpuseragentparser/tests/user_agents.dist.json, 63KB)
    #     that nothing loads. `js`/`css` are deliberately NOT in (a): at depth a dir
    #     called test/ is usually a frontend ASSET dir, e.g.
    #     woocommerce/assets/js/frontend/test/*.js, which pages may load.
    location ~* ^/wp-content/(?:plugins|mu-plugins)/.*/(?:dev|tests?|bin|fixtures?|spec|__tests__|previs|sandbox|scratch)/.*\.(?:php|sh|bash|py|rb|pl|phtml|inc|json)$ {
        access_log off;
        return 404;
    }
    location ~* ^/wp-content/(?:plugins|mu-plugins)/[^/]+/(?:dev|tests?|bin|fixtures?|spec|__tests__|previs|sandbox|scratch)(?:/|$) {
        access_log off;
        return 404;
    }

    # Static assets (only useful WITH cookie since the HTML linking them is gated)
    # 1y immutable: EVERY loader now carries ?v=<filemtime> — HTML-linked assets via
    # site-header.php, pwa.js-injected overlays via the LG_V map pwa-loader.php
    # prepends — so immutable is safe again. The old overlay-nocache regex block
    # (a workaround for hand-bumped ?v=N going stale) is retired (deploy-one-pull
    # 2026-07-26); that removes ~20 revalidation round-trips per page.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|avif|woff|woff2|ttf|eot|otf|mp4|webm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
        access_log off;
        log_not_found off;
    }

    # /.well-known/ must serve ANONYMOUSLY over 443 (documented gate-exempt path;
    # only the :80 block had it). Android Digital Asset Links (assetlinks.json)
    # verifies the TWA APK with an anonymous fetch (Buck 2026-06-11).
    location ^~ /.well-known/ { root /var/www/dev; try_files $uri =404; access_log off; }

    # Always-deny patterns
    location ~ /\.(?!well-known/) { deny all; }
    location ~* wp-config[^/]*\.php$ { deny all; }   # also wp-config(1).php etc (Buck F5)
    location = /xmlrpc.php { deny all; }   # F3: pingback/multicall amplification
    # Backup/editor cruft must never serve — .bak/.save/.old/.orig/.swp and
    # suffixed variants (.bak-*, .bak.<ts>) incl. wp-config.php.bak* w/ live
    # creds (Buck launch-blocker 2026-06-11). 224 such files sat raw in docroot.
    location ~* \.(bak|save|old|orig|swp|swo|tmp)([.\-][\w.\-]*)?$ { deny all; }

    # ----- lg-layout-v2 mockups + harness outputs (static, gated) -----
    # Browse architecture mockups + test snapshots from a real browser:
    #   https://dev2.loothgroup.com/v2/mockup/render-pipeline.html
    #   https://dev2.loothgroup.com/v2/mockup/editor-pipeline.html
    #   https://dev2.loothgroup.com/v2/docs/README.md   (raw markdown)
    location ^~ /v2/ {
        alias /srv/lg-layout-v2/;
        # autoindex OFF (infra lane 2026-06-13): directory listing exposed the
        # whole lg-layout-v2 source tree. Explicit mockup/doc files still serve
        # by path (see URLs above); the tree no longer enumerates itself.
        autoindex off;
        default_type text/plain;
        types {
            text/html  html htm;
            text/css   css;
            application/javascript js;
            application/json json;
            image/png  png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
        }
        # Source must never be served — PHP here was being returned as readable
        # plaintext (source disclosure). Deny outright (infra lane 2026-06-13).
        location ~ \.php$ { return 403; }
    }

    # ----- Chrome DevTools remote-debug proxy — REMOVED from the prod-bound conf -----
    # The Chrome remote-debug proxy was removed (infra lane 2026-06-13): it exposed
    # Chrome's debug surface behind only the shared dev cookie, and dev is promoted
    # in-place to live. Automation (craft-gate, chrome-dev-login) connects to the
    # local debug port DIRECTLY and is unaffected; humans wanting browser DevTools
    # should SSH-tunnel the port. A craft gate keeps the proxy route + debug port
    # absent from this conf.

    # ----- Gated locations (everything else) -----
    # ----- Strangler apps (extracted to includes 2026-05-27) -----
    # Each strangler owns its own snippet under /etc/nginx/snippets/.
    # Source-of-truth copies live in each project's repo as nginx-snippet.conf.
    # Order matters where prefixes overlap; all three currently disjoint.
    # The catch-all `location /` below this is the WP fallback.
    include /etc/nginx/snippets/strangler-profile-app.conf;
    include /etc/nginx/snippets/strangler-archive-poc.conf;
    include /etc/nginx/snippets/strangler-bb-mirror.conf;
    include /etc/nginx/snippets/strangler-events.conf;
    include /etc/nginx/snippets/strangler-membership.conf;
    include /etc/nginx/snippets/strangler-shop-planner.conf;
    include /etc/nginx/snippets/lg-shared.conf;

    # ── code-server (Ian's VS Code), 2026-07-27 ────────────────────────────────
    # Served through the 443 that is already open rather than on its own port:
    # dev1 exposes code-server directly on :8443 with TLS, which needs both a
    # security-group rule and a world-readable letsencrypt private key (dev1's is
    # mode 654). dev2 keeps its keys at 700 and this box is the image live is
    # built from, so nginx terminates TLS instead and code-server listens only on
    # 127.0.0.1:8444. No open port, no key permission change, nothing to click in
    # the AWS console.
    # ^~ is load-bearing, not decoration. The static-asset regex location further
    # down (`~* \.(jpg|css|js|…)$`) outranks a plain prefix match, so every one of
    # the editor's own .css/.js/.ico requests was being matched by it and served
    # off the filesystem root instead of proxied — a 404 for each, which renders
    # as a blank white page. ^~ stops regex evaluation once this prefix matches.
    location ^~ /vscode/ {
        proxy_pass http://127.0.0.1:8444/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The editor is a long-lived websocket; without these it connects and dies.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering off;
        # MUST override the server-level sub_filter. It injects the PWA loader, the
        # theme boot script and GA into every text/html response, which would be
        # rewriting the editor's own HTML. nginx only inherits sub_filter when the
        # location defines none of its own, so this deliberate no-op turns it off.
        sub_filter 'lg-never-match-this-token' '';
        sub_filter_once on;
    }

    # location = / is now defined in strangler-archive-poc.conf (serves the archive-poc front feed).
    # Changed 2026-06-14 (Ian: "front page = home page"). Was: return 302 /hub/;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
        fastcgi_read_timeout 300;
    }

    access_log /var/log/nginx/dev.loothgroup.access.log;
    error_log  /var/log/nginx/dev.loothgroup.error.log;
}
