# ─── LANE PREVIEW — hub-seo-landing ──────────────────────────────────────────
# A URL that serves this BRANCH on the vhost Ian is already signed into.
# Installed/removed by tools/preview/lane-preview.sh.
#
#   https://dev2.loothgroup.com/hub/preview-seo/general/crazy-electrical-issue/
#
# NO FLAG ANY MORE. This preview existed to arm LG_HUB_TOPIC_LANDING; that flag
# and the legacy page it guarded are both retired, so the preview now does one
# thing — serve the BRANCH so a change can be verified over HTTP before it is
# merged. I deleted this file with the flag and had to bring it back within the
# hour: the flag was its ARGUMENT, not its PURPOSE.
#
# Read platform/nginx/lane-preview-account-following.conf first — the reasoning
# for "a path on :443, not a port, not a hostname" is written out there.
#
# ⚠️ `^~` IS LOAD-BEARING (trap 6). The vhost carries
# `location ~* \.(…|css|js|…)$`, and a REGEX location outranks a plain prefix
# one. Without `^~` the HTML would come from the branch while forums.css and
# forums.js were stolen by that regex and served from the document root — an
# unstyled page that reads as "the branch is broken" when the branch is fine.
#
# ⚠️ THE MOUNT IS UNDER /hub/ AND THAT IS NOT COSMETIC. The ≤640 reading surface
# is hub-polish.js's sheet, injected by pwa.js, which gates on
# `/^\/hub(\/|$)/.test(location.pathname)`. Under the conventional
# /preview/<lane>/… prefix that test is FALSE and the sheet never loads, which
# reads as "the mobile path is broken" when it was never loaded.
# `^~ /hub/preview-seo/` is a LONGER prefix than the real `^~ /hub/`, so nginx
# picks it; /hub/ itself is untouched.
#
# GATED FOR FREE — the dev2 server block returns 403 unless authorised, at
# SERVER level, so every location here inherits it.
#
# ⚠️ THE CANONICAL IT EMITS NAMES dev2.loothgroup.com, and under this prefix it
# names the PREVIEW path. That is correct self-referencing behaviour for the
# host and path that served it, and it is why this mount must never be exposed
# to a crawler — the dev gate is what guarantees that.

# Bare prefixes → the hub, so a link that loses its tail still lands somewhere.
# The conventional /preview/<lane>/ address is kept as a redirect so the lane's
# URL still reads the way every other lane's does.
location = /preview/hub-seo-landing/ { return 302 /hub/preview-seo/; }
location = /preview/hub-seo-landing  { return 302 /hub/preview-seo/; }
location = /hub/preview-seo { return 302 /hub/preview-seo/; }

# SHAPE COPIED FROM THE REAL /hub/ BLOCK (snippets/strangler-bb-mirror.conf) on
# purpose — alias + try_files + an EXACT nested location for the front
# controller. try_files' internal redirect re-runs location selection, and
# `location = …/index.php` is exact, so it wins; the broad `\.php$ { return 403; }`
# below cannot swallow it. Getting that order wrong is the "nested catch-all
# kills the parent's rewrites" trap, and `nginx -t` passes either way.
location ^~ /hub/preview-seo/ {
    alias /home/ubuntu/worktrees/hub-seo-landing/bb-mirror/web/;
    try_files $uri /hub/preview-seo/index.php;

    # Branch assets. Nested INSIDE the ^~ prefix so the vhost's own
    # `location ~* \.(css|js|…)$` never gets a chance to serve them from the
    # document root (trap 6 — an unstyled page reads as a broken branch).
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|avif|mp4)$ {
        try_files $uri =404;
    }

    location = /hub/preview-seo/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-bb-mirror.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/hub-seo-landing/bb-mirror/web/index.php;
        # Moves every self-link (cards, sort pills, ?body=/?replies=, the modal's
        # own permalink + share URL) onto the preview prefix. Read in
        # bb-mirror/config.php as $_SERVER['LG_BB_MIRROR_PUBLIC_PATH']; absent,
        # the constant is what it always was.
        fastcgi_param LG_BB_MIRROR_PUBLIC_PATH /hub/preview-seo;
        # NO fastcgi_cache. The real /hub/ block microcaches anon renders for 60s;
        # a preview that served Ian a 60-second-old build after a push would waste
        # his time and mine.
    }

    # A preview must never become a way to execute arbitrary PHP from a worktree.
    location ~ \.php$ { return 403; }
}
