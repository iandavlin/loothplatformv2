# ─── LANE PREVIEW — hub-seo-landing ──────────────────────────────────────────
# A URL Ian can click that serves this BRANCH with LG_HUB_TOPIC_LANDING ARMED,
# on the vhost he is already signed into. Installed/removed by
# tools/preview/lane-preview.sh — do not hand-copy this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/hub-seo-landing/hub/general/crazy-electrical-issue/
#     → the hub, with that discussion's modal open on it, body + replies in the
#       server HTML. Compare against the same slug on /hub/ (main, flag off).
#
# Read platform/nginx/lane-preview-account-following.conf first — the reasoning
# for "a path on :443, not a port, not a hostname" is written out there and is
# unchanged here. The notes below are only what is DIFFERENT for this lane.
#
# ⚠️ `^~` IS LOAD-BEARING (trap 6). The vhost carries
# `location ~* \.(…|css|js|…)$`, and a REGEX location outranks a plain prefix
# one. Without `^~` the HTML would come from the branch while forums.css and
# forums.js were stolen by that regex and served from the document root — an
# unstyled page that reads as "the branch is broken" when the branch is fine.
#
# THE FLAG IS SET AS A fastcgi_param, NOT AN ENVIRONMENT VARIABLE, and
# config.php reads BOTH sources for exactly this reason: a fastcgi_param lands in
# $_SERVER and NOT reliably in getenv(), so a getenv()-only flag would serve OFF
# on the very preview URL built for Ian to click. It also cannot be set by a
# query string — only by this file — so the preview is not a way for a visitor to
# switch the feature on anywhere else.
#
# GATED FOR FREE. The dev2 server block runs
# `if ($loothdev_is_authorized = 0) { return 403; }` at SERVER level, so every
# location here inherits it.
#
# WHAT THIS PREVIEW CANNOT SHOW, STATED PLAINLY. hub-polish.js (the ≤640 sheet)
# is a WEBROOT file served from /hub-polish.js at the document root, injected by
# pwa.js. It is not under this prefix and a preview must not repoint a root path
# the whole box shares, so the phone view here exercises forums.js §4f's SECOND
# rung — the sheet opened with a synthetic card, which re-fetches ?body=/?replies=
# — not the seeded first rung. The picture is the same; the request count is not.
# That rung exists anyway because these two files deploy through different
# couplings and can legitimately be at different commits.

# Bare prefixes → the hub, so a link that loses its tail still lands somewhere.
location = /preview/hub-seo-landing/ { return 302 /preview/hub-seo-landing/hub/; }
location = /preview/hub-seo-landing/hub { return 302 /preview/hub-seo-landing/hub/; }

# SHAPE COPIED FROM THE REAL /hub/ BLOCK (snippets/strangler-bb-mirror.conf) on
# purpose — alias + try_files + an EXACT nested location for the front
# controller. try_files' internal redirect re-runs location selection, and
# `location = …/index.php` is exact, so it wins; the broad `\.php$ { return 403; }`
# below cannot swallow it. Getting that order wrong is the "nested catch-all
# kills the parent's rewrites" trap, and `nginx -t` passes either way.
location ^~ /preview/hub-seo-landing/hub/ {
    alias /home/ubuntu/worktrees/hub-seo-landing/bb-mirror/web/;
    try_files $uri /preview/hub-seo-landing/hub/index.php;

    # Branch assets. Nested INSIDE the ^~ prefix so the vhost's own
    # `location ~* \.(css|js|…)$` never gets a chance to serve them from the
    # document root (trap 6 — an unstyled page reads as a broken branch).
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|avif|mp4)$ {
        try_files $uri =404;
    }

    location = /preview/hub-seo-landing/hub/index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-bb-mirror.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/hub-seo-landing/bb-mirror/web/index.php;
        # Moves every self-link (cards, sort pills, ?body=/?replies=, the modal's
        # own permalink + share URL) onto the preview prefix. Read in
        # bb-mirror/config.php as $_SERVER['LG_BB_MIRROR_PUBLIC_PATH']; absent,
        # the constant is what it always was.
        fastcgi_param LG_BB_MIRROR_PUBLIC_PATH /preview/hub-seo-landing/hub;
        # THE LANE'S FLAG. OFF in code, on HERE and nowhere else — /hub/ on this
        # same vhost keeps serving main's legacy standalone page, which is what
        # makes the two URLs a side-by-side comparison rather than a
        # before/after memory.
        fastcgi_param LG_BB_MIRROR_TOPIC_LANDING 1;
        # NO fastcgi_cache. The real /hub/ block microcaches anon renders for 60s;
        # a preview that served Ian a 60-second-old build after a push would waste
        # his time and mine.
    }

    # A preview must never become a way to execute arbitrary PHP from a worktree.
    location ~ \.php$ { return 403; }
}
