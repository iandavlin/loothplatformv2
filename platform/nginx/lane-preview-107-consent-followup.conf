# ─── LANE PREVIEW — 107-consent-followup ─────────────────────────────────────
# A URL Ian can click that serves THIS BRANCH, on the vhost he is already signed
# into. Installed and removed by tools/preview/lane-preview.sh — do not hand-copy
# this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/107-consent-followup/u/<slug>/      consent ON
#   https://dev2.loothgroup.com/preview/107-consent-followup/u-off/<slug>/  consent OFF
#
# WHY IT EXISTS HERE. Every surface this lane touches is symlinked out of
# ~/loothplatformv2-clean, which serves main — so /u/<slug> on dev2 renders the
# OLD tickbox copy no matter what is committed on this branch. The whole point
# of #107's follow-up is a sentence a member reads before they consent; it has
# to be read on a screen, not in a diff.
#
# ⚠️ NAMED CAPTURES, NOT $1. The dev-gate `map` is evaluated lazily and resets
# $1-$9 before fastcgi params are built — that is the capture-clobber that 404'd
# every /u/ profile on dev2 on 8/20 (lane 150 + keeper). The real
# strangler-profile-app.conf locations were converted to named captures in that
# fix; the older lane-preview snippets on this box were NOT, and still carry the
# broken shape. This one does not repeat it.
#
# ⚠️ `^~` / regex precedence: these are regex locations, which already outrank
# the vhost's `location ~* \.(css|js|…)$`, so there is no asset-stealing problem
# for the HTML itself. u.php's featured-card CSS is emitted INLINE inside the
# same flag check as its markup, so the preview needs no asset alias at all.
#
# GATED FOR FREE. The dev2 server block runs `if ($loothdev_is_authorized = 0)
# { return 403; }` at SERVER level and every location here inherits it. This is
# not a new unauthenticated surface.
#
# THE FLAG IS SET PER-LOCATION, AND EXPLICITLY IN BOTH STATES. `fastcgi_param`
# lands in $_SERVER but NOT reliably in getenv() — u.php reads both, which is
# why this works; an omitted param on the -off leg would leave the flag at
# whatever the tracked file says instead of proving inertness against the
# IDENTICAL commit, so it is set to 0 rather than left out.

location = /preview/107-consent-followup/ {
    return 302 /preview/107-consent-followup/u/ian-davlin-the-looth-group/;
}

# The consent copy, flag ON — the sentence under the tickbox is the thing to read.
location ~ "^/preview/107-consent-followup/u/(?<lg107_slug>[\w\-]+)/?$" {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/107-consent-followup/profile-app/web/u.php;
    fastcgi_param QUERY_STRING    slug=$lg107_slug&$args;
    fastcgi_param LG_FEATURED_CONSENT 1;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "107-consent-followup-on" always;
}

# Same branch, flag OFF — this is the byte-identical control. If these two pages
# differ by anything except the one sentence, the flag is not a clean no-op.
location ~ "^/preview/107-consent-followup/u-off/(?<lg107_slug2>[\w\-]+)/?$" {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/107-consent-followup/profile-app/web/u.php;
    fastcgi_param QUERY_STRING    slug=$lg107_slug2&$args;
    fastcgi_param LG_FEATURED_CONSENT 0;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "107-consent-followup-off" always;
}

# The front page, this branch, consent ON — what the featured card actually
# renders. Reads THIS WORKTREE's archive-poc/config.json (the app root is
# derived from SCRIPT_FILENAME's own directory), so it cannot disturb the
# selection live on dev2's front page.
location = /preview/107-consent-followup/front/ {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/107-consent-followup/archive-poc/web/index.php;
    fastcgi_param QUERY_STRING    $args;
    fastcgi_param LG_FEATURED_CONSENT 1;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "107-consent-followup-front-on" always;
}

location = /preview/107-consent-followup/front-off/ {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/107-consent-followup/archive-poc/web/index.php;
    fastcgi_param QUERY_STRING    $args;
    fastcgi_param LG_FEATURED_CONSENT 0;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "107-consent-followup-front-off" always;
}
