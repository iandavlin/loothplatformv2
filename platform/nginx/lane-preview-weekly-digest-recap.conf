# ─── LANE PREVIEW — weekly-digest-recap ──────────────────────────────────────
# A URL Ian can click that serves THIS BRANCH's signup page, on the vhost he is
# already signed into. Installed and removed by tools/preview/lane-preview.sh —
# do not hand-copy this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/weekly-digest-recap/weekly-email-sign-up/
#
# Read platform/nginx/lane-preview-account-following.conf first: the reasoning for
# a PATH on :443 (Cloudflare answers 403 on alternate ports; the cert carries one
# SAN; WP sets a host-only session cookie) applies here unchanged and is not
# repeated. So does the free gating — the dev2 server block runs
# `if ($loothdev_is_authorized = 0) { return 403; }` at SERVER level, so this
# inherits it and can never be a new unauthenticated surface.
#
# ⚠️ `^~` IS LOAD-BEARING. The vhost carries `location ~* \.(…|css|js|…)$`, and a
# REGEX location outranks a plain prefix one (the box's trap 6). Without `^~` the
# HTML would come from the branch and every asset would be stolen by that regex.
# This page inlines its CSS in a <style> block, so nothing would visibly break
# today — which is exactly why the prefix is written in now, rather than after
# someone adds a stylesheet and spends an afternoon on it.
#
# ── HOW THIS DIFFERS FROM THE account-following ONE, AND WHY ─────────────────
# That lane previews a STANDALONE front controller, so it just points
# SCRIPT_FILENAME at the branch's router.php. This surface is a WORDPRESS PAGE
# whose markup comes from a plugin WP loads through the docroot symlink into the
# SERVING checkout — no fastcgi_param can repoint that, and loading the branch's
# class beside it would fatal on a duplicate declaration.
#
# So SCRIPT_FILENAME points at a small front controller IN THE WORKTREE which
# boots the serving WordPress by absolute path and renders the BRANCH's template.
# Variant B is a template change, so the template is the only thing that has to
# come from the branch.
#
# NOTHING IS RE-POINTED. This uses the EXISTING WP pool (looth-dev) as a runtime
# and takes its target per request, exactly as the membership preview does. The
# real /weekly-email-sign-up/ on the same vhost keeps rendering from the serving
# checkout, unchanged.

# Bare prefix → the page, so a link that loses its tail still lands somewhere.
location = /preview/weekly-digest-recap/ {
    return 302 /preview/weekly-digest-recap/weekly-email-sign-up/;
}

# The surface itself, rendered from the BRANCH's template.
location ^~ /preview/weekly-digest-recap/weekly-email-sign-up {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/weekly-digest-recap/lg-weekly-digest/dev/preview/signup-preview.php;
    fastcgi_param QUERY_STRING    $args;
}
