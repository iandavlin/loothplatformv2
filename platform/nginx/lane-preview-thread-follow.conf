# ─── LANE PREVIEW — thread-follow ────────────────────────────────────────────
# A URL Ian can click that serves THIS BRANCH's Hub, on the vhost he is already
# signed into. Installed and removed by tools/preview/lane-preview.sh — do not
# hand-copy this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/thread-follow/hub/?type=discussions
#
# Modelled on lane-preview-account-following.conf; read that one first. The two
# things it teaches are both load-bearing here too:
#
# ⚠️ `^~` IS LOAD-BEARING. The vhost carries `location ~* \.(…|css|js|…)$`, and a
# REGEX location outranks a plain prefix one. Without `^~` the HTML would come
# from the branch while every stylesheet and script was stolen by that regex and
# served from the document root — an unstyled page that reads as "the branch is
# broken" when the branch is fine. Box trap 6.
#
# GATED FOR FREE. The dev2 server block runs
# `if ($loothdev_is_authorized = 0) { return 403; }` at SERVER level, so every
# location here inherits it. This preview is not a new unauthenticated surface.
#
# NO NEW FPM POOL, NOTHING RE-POINTED. php8.3-fpm-bb-mirror is a runtime, not a
# checkout; it takes its target from SCRIPT_FILENAME per request. Pointing THIS
# location at the worktree changes nothing for /hub/ on the same vhost, which
# keeps serving /srv/bb-mirror -> the serving checkout.

# Bare prefix → the discussions feed, so a link that loses its tail still lands.
location = /preview/thread-follow/ {
    return 302 /preview/thread-follow/hub/?type=discussions;
}

# ⚠️ THE FLAG IS ON **HERE AND ONLY HERE**. LG_THREAD_FOLLOW_ENABLED defaults OFF
# (bb-mirror/config.php) and stays off for /hub/ and for live. A fastcgi_param can
# only be set by an nginx conf — never by a query string — so this cannot be
# switched on by a visitor. Ian must click the REAL modal, not the mock, and this
# is the one place that is true.
location = /preview/thread-follow/hub/index.php {
    # ⚠️ fastcgi.conf, NOT snippets/fastcgi-php.conf. The latter carries
    # `try_files $fastcgi_script_name =404`, which is resolved against the SERVER's
    # document root — and /preview/<lane>/... exists in a worktree, not there. It
    # 404s before nginx ever reaches fastcgi_pass, so PHP is never invoked and even
    # an `always` add_header never fires: the location looks like it did not match
    # at all. Cost me three reload cycles. account-following's conf uses fastcgi.conf
    # for exactly this reason; copy that, not the site's default php include.
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-bb-mirror.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/thread-follow/bb-mirror/web/index.php;
    fastcgi_param LG_BB_MIRROR_FOLLOW 1;
    # The mount the app must believe it is under, or index.php cannot strip the
    # prefix to route and every internal link would jump back out to the real /hub/.
    # Same mechanism as membership-pages' LG_MS_PUBLIC_PATH.
    fastcgi_param LG_BB_MIRROR_PUBLIC_PATH /preview/thread-follow/hub;
    fastcgi_param QUERY_STRING $args;
    # NO fastcgi_cache. The hub's own location microcaches anon renders for 60s;
    # a preview that served Ian a cached copy of a page he just asked to be
    # re-rendered would waste the one thing this exists for.
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "thread-follow" always;
}

# Branch assets — forums.css / forums.js and anything else under bb-mirror/web.
# MUST be ^~ (see above). Longer prefix than the front controller below, so it wins.
location ^~ /preview/thread-follow/hub/ {
    alias /home/ubuntu/worktrees/thread-follow/bb-mirror/web/;
    # A preview must never become a way to execute arbitrary PHP out of a worktree.
    location ~ \.php$ { return 403; }
    try_files $uri /preview/thread-follow/hub/index.php;
}
