# ─── LANE PREVIEW — 187-loothprint-images ────────────────────────────────────
# Installed and removed by tools/preview/lane-preview.sh — do not hand-copy this
# into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/187-loothprint-images/loothprint/fret-sander-v2/
#
# WHY THIS LANE NEEDS ONE. #187 changes how every article <img> is emitted, in
# archive-poc/standalone/engine/blocks/*. /srv/archive-poc symlinks into
# ~/loothplatformv2-clean, so dev2 serves MAIN's copy of those blocks — a CLI
# render proves the HTML and proves nothing about the bytes a browser actually
# pulls, which is the entire subject of this issue. Without this, "measured the
# page weight on dev2" would mean "measured main".
#
# Everything lane-preview-179-loothprint-bundle.conf teaches applies unchanged;
# this is that file with the lane name swapped and the CPT list widened to the
# three shapes the craft gate now audits. Its two traps, repeated because they
# cost a lane each:
#
# ⚠️ fastcgi.conf, NOT snippets/fastcgi-php.conf — the latter's
# `try_files $fastcgi_script_name =404` resolves against the SERVER document
# root, where /preview/<lane>/… does not exist, so it 404s before fastcgi_pass
# and the location looks like it never matched.
#
# ⚠️ SCRIPT_FILENAME IS SET AFTER THE INCLUDE, deliberately — fastcgi.conf
# derives it from $document_root$fastcgi_script_name and the later assignment
# wins.
#
# GATED FOR FREE: the dev2 server block runs the loothdev check at SERVER level,
# so this inherits it and is not a new anonymous surface. NO new FPM pool and
# nothing re-pointed: php8.3-fpm-archive-poc takes its target from
# SCRIPT_FILENAME per request, and the real /loothprint/<slug>/ location on this
# vhost keeps serving /srv/archive-poc untouched.

location = /preview/187-loothprint-images/ {
    return 302 /preview/187-loothprint-images/loothprint/fret-sander-v2/;
}

location ~ ^/preview/187-loothprint-images/(loothprint|post-type-videos|post-imgcap|sponsor-post)/([a-z0-9][a-z0-9_\-]*[a-z0-9])/?$ {
    if ($arg_lg_edit)     { rewrite ^ /index.php last; }
    if ($arg_lg_comments) { rewrite ^ /index.php last; }
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/187-loothprint-images/archive-poc/standalone/render.php;
    fastcgi_param LG_POST_TYPE    $1;
    fastcgi_param LG_SLUG         $2;
    fastcgi_param QUERY_STRING    $args;
    # NO fastcgi_cache: this exists to measure bytes, and a cached copy would be
    # measuring the previous render.
    add_header Cache-Control "no-store" always;
}
