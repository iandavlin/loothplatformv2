# ─── LANE PREVIEW — notif-quickreply ─────────────────────────────────────────
# A URL Ian can click that runs tap-to-reply for real, on the vhost he is already
# signed into. Installed and removed by tools/preview/lane-preview.sh — do not
# hand-copy this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/notif-quickreply/hub/?type=discussions
#
# ⚠️ THIS ONE ONLY WORKS AFTER THE BRANCH IS MERGED (flag still OFF). That is not a
# limitation of the preview mechanism, it is where this feature lives. Read this
# before wondering why it shows nothing on an unmerged branch:
#
#   The modal is driven by webroot JS — notif-reply.js, plus the #lgc-quote slot in
#   hub-polish.js and the row handlers in bottom-nav.js. Those files are NOT served
#   from the mount below. pwa.js injects them at ABSOLUTE paths (/hub-polish.js,
#   /notif-reply.js), which resolve against the DOCUMENT ROOT, where each one is an
#   individual symlink into the serving checkout. And /pwa.js itself — the file that
#   would have to know to inject notif-reply.js at all — is likewise the serving
#   checkout's copy. So an unmerged branch previewed here would render its own HTML
#   while running MAIN's entire overlay layer: a page that looks right and does
#   nothing. Serving those three files from the worktree instead would mean pointing
#   vhost-wide locations at a lane's branch, which would change the real /hub/ for
#   everyone. Not worth it, and not safe.
#
#   The order that DOES work is the one the flag policy exists for:
#     1. merge with LG_NOTIF_QUICKREPLY_ENABLED OFF (a proven byte-identical no-op),
#     2. pull, and CREATE THE NEW SYMLINK — see the deploy note below,
#     3. install this preview, which turns the flag ON for this path ONLY,
#     4. Ian clicks the real control,
#     5. only then does the constant flip for everyone.
#
# ⚠️ DEPLOY COUPLING, step 2, and it is easy to miss: webroot/notif-reply.js is a NEW
# file and the docroot links each webroot file INDIVIDUALLY. A pull alone leaves
# /notif-reply.js 404ing. Harmless while the flag is off (pwa.js never requests it),
# but the preview below would come up dead. Run:
#     sudo /home/ubuntu/loothplatformv2-clean/webroot/install-symlinks.sh --new-only
#
# ⚠️ `^~` IS LOAD-BEARING — the vhost carries a regex location for static assets and
# a REGEX location outranks a plain prefix one. Without it the branch's HTML would
# load the document root's CSS. Box trap 6; see lane-preview-account-following.conf.
#
# GATED FOR FREE: the dev2 server block returns 403 at SERVER level for an
# unauthorised visitor, and every location here inherits it.

location = /preview/notif-quickreply/ {
    return 302 /preview/notif-quickreply/hub/?type=discussions;
}

# ⚠️ THE FLAG IS ON **HERE AND ONLY HERE**. LG_NOTIF_QUICKREPLY_ENABLED defaults OFF
# in bb-mirror/config.php and stays off for /hub/ and for live. A fastcgi_param can
# only be set by an nginx conf — never by a query string — so a visitor cannot switch
# this on. Ian must click the REAL modal, and this is the one place that is true.
location = /preview/notif-quickreply/hub/index.php {
    # ⚠️ fastcgi.conf, NOT snippets/fastcgi-php.conf — the latter's `try_files` is
    # resolved against the SERVER root, where /preview/... does not exist, so it 404s
    # before nginx ever reaches fastcgi_pass and the location looks like it never
    # matched. Documented the hard way by the thread-follow lane; do not "fix" this.
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-bb-mirror.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/loothplatformv2-clean/bb-mirror/web/index.php;
    fastcgi_param LG_BB_MIRROR_NOTIF_QUICKREPLY 1;
    fastcgi_param LG_BB_MIRROR_PUBLIC_PATH /preview/notif-quickreply/hub;
}

location ^~ /preview/notif-quickreply/hub/ {
    alias /home/ubuntu/loothplatformv2-clean/bb-mirror/web/;
    index index.php;
    location ~ \.php$ { return 403; }
    try_files $uri /preview/notif-quickreply/hub/index.php;
}

# The quote read. Scoped to THIS path so the flag stays off for the real endpoint:
# without it the modal would fetch the real /bb-mirror-api/v0/topic, whose flag is
# off, get the ordinary OP fragment back, find no quote and fall back to navigating —
# a preview that silently demonstrates nothing.
location = /preview/notif-quickreply/bb-mirror-api/v0/topic {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-bb-mirror.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/loothplatformv2-clean/bb-mirror/api/v0/topic.php;
    fastcgi_param LG_BB_MIRROR_NOTIF_QUICKREPLY 1;
    fastcgi_param QUERY_STRING $args;
}
