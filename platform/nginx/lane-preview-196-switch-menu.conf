# ─── LANE PREVIEW — 196-switch-menu ──────────────────────────────────────────
# A URL Ian can click that serves this BRANCH, on the vhost he is already signed
# into. Installed and removed by tools/preview/lane-preview.sh — do not hand-copy
# this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/196-switch-menu/header/          <- the menu
#   https://dev2.loothgroup.com/preview/196-switch-menu/switch-billing/  <- the page
#
# ⚠️ WHY THERE ARE TWO, AND WHY THE FIRST ONE IS NOT A MOCK. Every membership
# page requires '/srv/lg-shared/site-header.php', and /srv/lg-shared is a symlink
# into the SERVING CHECKOUT, which serves main. So a preview of the PAGE renders
# the branch's body wearing MAIN'S HEADER — and the header is the whole of #196.
# /header/ runs the branch's own copy of the partial with a hand-built ctx so the
# menu can actually be looked at before it is merged
# (trap-harness-and-serve-answer-from-main).
#
# ⚠️ `^~` IS LOAD-BEARING, BOTH TIMES. The vhost carries
# `location ~* \.(…|css|js|…)$`, and a REGEX location outranks a plain prefix
# one. Without `^~` the HTML would come from the branch and every stylesheet
# would be stolen by that regex and served from the document root — an unstyled
# page that reads as "the branch is broken" when the branch is fine. Trap 6 on
# the box's own list.
#
# GATED FOR FREE. The dev2 server block runs
# `if ($loothdev_is_authorized = 0) { return 403; }` at SERVER level, so every
# location here inherits it. Neither of these is a new unauthenticated surface.
#
# NO NEW FPM POOL AND NOTHING RE-POINTED. The membership pool takes its target
# from SCRIPT_FILENAME per request, so pointing THIS location at the worktree
# changes nothing for /switch-billing/ or /manage-subscription/ on the same
# vhost, which keep serving /srv/membership-pages -> the serving checkout.

# Bare prefix → the menu, so a link that loses its tail still lands somewhere.
location = /preview/196-switch-menu/ {
    return 302 /preview/196-switch-menu/header/;
}

# Branch assets. MUST be ^~ (see above) and MUST be the longer prefix so it wins
# over the front-controller locations below.
location ^~ /preview/196-switch-menu/membership-pages/ {
    alias /home/ubuntu/worktrees/196-switch-menu/membership-pages/web/;
    # A preview must not become a way to execute arbitrary PHP out of a worktree.
    location ~ \.php$ { return 403; }
    try_files $uri =404;
}

# THE ACCOUNT MENU, rendered from the branch's own copy of the shared partial.
location ^~ /preview/196-switch-menu/header {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-membership.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/196-switch-menu/tools/preview/196-header-probe.php;
    fastcgi_param LG_196_BASE     /preview/196-switch-menu;
    # ⚠️ WITHOUT THIS THE PREVIEW SHOWS ONLY HALF THE CHANGE, and the half it
    # hides is the one on a phone. The state reader resolves through __DIR__ to
    # the BRANCH's platform/config/header-join-stripe.php — the tracked default,
    # 'off' — because the .local.php that puts dev2 in 'allowlist' is gitignored
    # and lives only in the serving checkout. In 'off' $join_pill_authed is false,
    # so the pill beside the chip is never drawn and the first run of
    # 196-switch-shots.py reported it MISSING at all four widths. dev2 IS in
    # 'allowlist', so pinning it here shows Ian the state his box actually
    # serves. Reaches the reader through $_SERVER (a fastcgi_param does not
    # reliably reach getenv) and can never be set by a query string.
    fastcgi_param LG_HEADER_JOIN_STRIPE allowlist;
    fastcgi_param QUERY_STRING    $args;
}

# THE PAGE, rendered by the BRANCH's front controller.
location ^~ /preview/196-switch-menu/switch-billing {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-membership.sock;
    # ⚠️ THE SHIM, NOT router.php DIRECTLY. The page requires the shared header
    # from /srv/lg-shared, which symlinks into the SERVING CHECKOUT — so a plain
    # preview renders the branch's page wearing MAIN'S header, and the first
    # screenshot run caught exactly that: the switch page under an orange "Join"
    # pill. The shim loads the branch's partials first; their function_exists
    # guards then make the page's own require a no-op. See the file's docblock.
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/196-switch-menu/tools/preview/196-page-shim.php;
    fastcgi_param LG_MS_SLUG      switch-billing;
    fastcgi_param LG_HEADER_JOIN_STRIPE allowlist;
    # Moves the CSS/JS links to the preview prefix. Read in membership-pages/
    # config.php; a fastcgi_param can only be set by this file, never by a query
    # string, and when it is absent the constant is what it always was.
    fastcgi_param LG_MS_PUBLIC_PATH /preview/196-switch-menu/membership-pages;
    fastcgi_param QUERY_STRING    $args;
}
