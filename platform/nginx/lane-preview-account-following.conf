# ─── LANE PREVIEW — account-following ────────────────────────────────────────
# A URL Ian can click that serves a BRANCH, on the vhost he is already signed
# into. Installed and removed by tools/preview/lane-preview.sh — do not hand-copy
# this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/account-following/manage-subscription/
#
# WHY A PATH ON :443 AND NOT A PORT. Measured 2026-07-30: dev2.loothgroup.com is
# Cloudflare-proxied (it resolves to 2606:4700::…), and Cloudflare answers 403
# ITSELF on 8443 and 2053 — a raw listener bound on the origin never received a
# connection on either. So no alternate port is reachable from Ian's browser, at
# any security-group setting. A separate hostname is out too: the cert carries
# exactly one SAN (dev2.loothgroup.com, no wildcard) and WordPress sets a
# HOST-ONLY session cookie, so on any other name he would arrive signed out and
# the member-only section would correctly render nothing. Same host, same port,
# a new path is the only shape that reuses the gate cookie AND the WP session.
#
# ⚠️ `^~` IS LOAD-BEARING, BOTH TIMES. The vhost carries
# `location ~* \.(…|css|js|…)$` at :265, and a REGEX location outranks a plain
# prefix one. Without `^~` the HTML would be served from the branch and every
# stylesheet and script would be stolen by that regex and served from the
# document root — an unstyled page that reads as "the branch is broken" when the
# branch is fine. This is trap 6 on the box's own list.
#
# GATED FOR FREE, AND THAT IS DELIBERATE. The dev2 server block runs
# `if ($loothdev_is_authorized = 0) { return 403; }` at SERVER level, so every
# location here inherits it. A preview of a page that lists a member's followed
# discussions must never be a new unauthenticated surface, and this one cannot
# be: it is behind the same cookie as everything else on the vhost.
#
# NO NEW FPM POOL, AND NOTHING RE-POINTED. The membership pool is a PHP runtime,
# not a checkout — it already reads /home/ubuntu (0711, traversable) and takes
# its target from SCRIPT_FILENAME per request. Pointing THIS location's
# SCRIPT_FILENAME at the worktree changes nothing for /manage-subscription/ on
# the same vhost, which keeps serving /srv/membership-pages -> the serving
# checkout. Verified by loading both URLs after install.

# Bare prefix → the page, so a link that loses its tail still lands somewhere.
location = /preview/account-following/ {
    return 302 /preview/account-following/manage-subscription/;
}

# Branch assets. MUST be ^~ (see above) and MUST be the longer prefix so it wins
# over the front-controller location below.
location ^~ /preview/account-following/membership-pages/ {
    alias /home/ubuntu/worktrees/account-following/membership-pages/web/;
    # A preview must not become a way to execute arbitrary PHP out of a worktree.
    location ~ \.php$ { return 403; }
    try_files $uri =404;
}

# The surface itself, rendered by the BRANCH's front controller.
location ^~ /preview/account-following/manage-subscription {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-membership.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/account-following/membership-pages/web/router.php;
    fastcgi_param LG_MS_SLUG      manage-subscription;
    # Moves the CSS/JS links to the preview prefix. Read in membership-pages/
    # config.php; a fastcgi_param can only be set by this file, never by a query
    # string, and when it is absent the constant is what it always was.
    fastcgi_param LG_MS_PUBLIC_PATH /preview/account-following/membership-pages;
    # The per-row toggles Ian asked for, ON here and nowhere else. The flag
    # defaults OFF in code; this is the only thing that turns it on, and only for
    # this preview path — /manage-subscription/ on the same vhost is untouched.
    fastcgi_param LG_FOLLOWING_ROW_TOGGLES 1;
    fastcgi_param QUERY_STRING    $args;
}
