# ─── LANE PREVIEW — 199-loothprint-gating ────────────────────────────────────
# Installed and removed by tools/preview/lane-preview.sh — do not hand-copy this
# into /etc/nginx.
#
#   AFTER (this branch, flag ON):
#     https://dev2.loothgroup.com/preview/199-loothprint-gating/loothprint/lane199-after/
#   BEFORE (main, exactly what a member sees today) is the ORDINARY url:
#     https://dev2.loothgroup.com/loothprint/lane199-cleanup-stik-recreation/
#
# WHY THIS LANE NEEDS ONE. #199 changes Renderer, GateCta and the gallery block
# in archive-poc/standalone/engine/*. /srv/archive-poc symlinks into
# ~/loothplatformv2-clean, so dev2 serves MAIN's copy of all three — the whole
# subject of the issue is which card a logged-out visitor is handed, and without
# this, "checked the gating on dev2" would mean "checked main".
#
# ⚠️ TWO POSTS, NOT ONE, AND THAT IS DELIBERATE. The standalone renderer reads a
# MATERIALIZED BLOB, and a blob is baked by whichever synthesizer ran at save
# time. So the flag alone cannot turn one page from before into after: the
# before page's blob says `callout`, the after page's says `download`. Baking one
# post both ways would leave whichever URL was not just re-baked showing a hybrid
# that is neither state. Instead:
#   78935 lane199-cleanup-stik-recreation — blob baked by MAIN. The BEFORE.
#   78961 lane199-after                   — blob baked by THIS BRANCH, flag on.
# Byte-identical inputs (same two photos, same ZIP, same video, same tier), so
# the only difference between the two pages is the code and the flag.
#
# ⚠️ THE FLAG ARRIVES AS A fastcgi_param, WHICH IS NOT IN getenv(). It lands in
# $_SERVER only. Renderer::loothprintGatingEnabled() reads BOTH for exactly this
# reason — a getenv()-only reader serves the OFF path on the very preview URL
# built to show the ON one, which has cost a lane before.
#
# Everything lane-preview-187-loothprint-images.conf teaches applies unchanged.
# Its two traps, repeated because they cost a lane each:
#
# ⚠️ fastcgi.conf, NOT snippets/fastcgi-php.conf — the latter's
# `try_files $fastcgi_script_name =404` resolves against the SERVER document
# root, where /preview/<lane>/… does not exist, so it 404s before fastcgi_pass
# and the location looks like it never matched.
#
# ⚠️ SCRIPT_FILENAME IS SET AFTER THE INCLUDE, deliberately — fastcgi.conf
# derives it from $document_root$fastcgi_script_name and the later assignment
# wins.
#
# GATED FOR FREE: the dev2 server block runs the loothdev check at SERVER level,
# so this inherits it and is not a new anonymous surface. NO new FPM pool and
# nothing re-pointed: php8.3-fpm-archive-poc takes its target from
# SCRIPT_FILENAME per request, and the real /loothprint/<slug>/ location on this
# vhost keeps serving /srv/archive-poc untouched.

location = /preview/199-loothprint-gating/ {
    return 302 /preview/199-loothprint-gating/loothprint/lane199-after/;
}

location ~ ^/preview/199-loothprint-gating/(loothprint|loothcuts|post-type-videos|post-imgcap)/([a-z0-9][a-z0-9_\-]*[a-z0-9])/?$ {
    if ($arg_lg_edit)     { rewrite ^ /index.php last; }
    if ($arg_lg_comments) { rewrite ^ /index.php last; }
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/199-loothprint-gating/archive-poc/standalone/render.php;
    fastcgi_param LG_POST_TYPE    $1;
    fastcgi_param LG_SLUG         $2;
    fastcgi_param QUERY_STRING    $args;
    # The ruling under review. Armed here so Ian is looking at the ON state
    # while the tracked default stays OFF for everybody else.
    fastcgi_param LG_V2_LOOTHPRINT_GATING 1;
    # NO fastcgi_cache: a cached copy would be showing the previous render, and
    # this exists to compare two renders.
    add_header Cache-Control "no-store" always;
}

# The same branch code with the flag OFF, so the flag itself can be A/B'd on one
# page rather than inferred from two. Its blob is the branch-baked one, so this
# is "branch code, switch down" — NOT the before page, which is main's code on
# main's blob at the ordinary /loothprint/ url.
location ~ ^/preview/199-loothprint-gating-off/(loothprint|loothcuts)/([a-z0-9][a-z0-9_\-]*[a-z0-9])/?$ {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/199-loothprint-gating/archive-poc/standalone/render.php;
    fastcgi_param LG_POST_TYPE    $1;
    fastcgi_param LG_SLUG         $2;
    fastcgi_param QUERY_STRING    $args;
    add_header Cache-Control "no-store" always;
}
