# ─── LANE PREVIEW — 179-loothprint-bundle ────────────────────────────────────
# A URL Ian can click that serves THIS BRANCH's standalone article page, on the
# vhost he is already signed into. Installed and removed by
# tools/preview/lane-preview.sh — do not hand-copy this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/179-loothprint-bundle/loothprint/fret-sander-v2/
#
# WHY THIS LANE NEEDS ONE. #179 moves the Edit control into the sticky dock and
# restyles that dock. Both live in archive-poc/standalone/render.php, and
# /srv/archive-poc is a symlink into ~/loothplatformv2-clean — so dev2 serves
# MAIN's copy and a branch edit is invisible there. "Verified on dev2" would mean
# "I read the diff". Box trap: a lane verifying on dev2 is usually testing main.
# It is also the only way the house rule (merges need Ian-verified) is satisfiable
# at all for this file, since the serve only ever carries merged code.
#
# Read lane-preview-frontend-compose.conf and lane-preview-account-following.conf
# first; everything they teach applies unchanged. The two that bite here:
#
# ⚠️ fastcgi.conf, NOT snippets/fastcgi-php.conf — the latter carries
# `try_files $fastcgi_script_name =404` resolved against the SERVER document root,
# where /preview/<lane>/… does not exist. It 404s before fastcgi_pass, so PHP is
# never invoked and the location looks like it never matched.
#
# ⚠️ SCRIPT_FILENAME IS SET AFTER THE INCLUDE, deliberately. fastcgi.conf derives
# it from $document_root$fastcgi_script_name; the later assignment wins. This is
# the same order the live block in archive-poc/nginx-snippet.conf uses.
#
# GATED FOR FREE. The dev2 server block runs the loothdev authorization check at
# SERVER level, so every location here inherits it. Not a new anonymous surface.
#
# NO NEW FPM POOL, NOTHING RE-POINTED. php8.3-fpm-archive-poc is a runtime, not a
# checkout; it takes its target from SCRIPT_FILENAME per request. The real
# /loothprint/<slug>/ location on this same vhost keeps serving /srv/archive-poc,
# untouched. (Verified the pool user can read the worktree:
# `sudo -u archive-poc test -r …/render.php` passes — /home/ubuntu is world-x.)

location = /preview/179-loothprint-bundle/ {
    return 302 /preview/179-loothprint-bundle/loothprint/fret-sander-v2/;
}

# Mirrors the live managed-CPT location, pointed at the worktree. The two `if`
# rewrites are copied verbatim from it: ?lg_edit=1 and ?lg_comments hand off to
# WordPress, which is the SERVE's WordPress — correct, because this lane does not
# change the layout editor, only the door that opens it.
location ~ ^/preview/179-loothprint-bundle/(loothprint|post-type-videos|post-imgcap)/([a-z0-9][a-z0-9_\-]*[a-z0-9])/?$ {
    if ($arg_lg_edit)     { rewrite ^ /index.php last; }
    if ($arg_lg_comments) { rewrite ^ /index.php last; }
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/179-loothprint-bundle/archive-poc/standalone/render.php;
    fastcgi_param LG_POST_TYPE    $1;
    fastcgi_param LG_SLUG         $2;
    fastcgi_param QUERY_STRING    $args;
    # NO fastcgi_cache — a preview that served Ian a cached copy of the page he
    # just asked to be re-rendered would waste the one thing this exists for.
    add_header Cache-Control "no-store" always;
}
