# ─── LANE PREVIEW — 202-web-decision-box ─────────────────────────────────────
# A URL Ian can click that serves THIS BRANCH's decision box, on the vhost he is
# already signed into. Installed and removed by tools/preview/lane-preview.sh —
# do not hand-copy this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/202-web-decision-box/
#
# WHY THIS LANE NEEDS ONE. The lanes page is a STATIC FILE rendered every five
# minutes by a timer running out of ~/keeper-repo, and the two endpoints it talks
# to are symlinked into /var/www/dev from the serving checkout. So the whole
# feature is invisible on dev2 until it is merged — and the house rule is that a
# merge needs Ian to have seen the running thing. Without this file the only
# honest report would be "I read my own diff".
#
# ⚠️ THIS CONF DEVIATES FROM THE /preview/<lane>/ CONVENTION, ON PURPOSE, AND
# THAT DESERVES A PARAGRAPH.
#
# The page's own script fetches `/lanes-decisions.php` and posts to
# `/lanes-decide.php` — ABSOLUTE paths, because that is what the deployed page
# does. Rewriting them to relative paths for the preview would mean previewing a
# page whose JS is not the JS that ships, which is the exact class of "verified"
# that this box has been burned by. So the two endpoints are claimed at the ROOT
# of the vhost.
#
# That is safe here, and it was MEASURED rather than assumed:
#   · neither path exists on dev2 today — `bash tools/lanes-poke-install.sh
#     --verify` reports both as MISSING, because they cannot be symlinked into
#     the docroot until this branch is in the serving checkout. So these two
#     locations SHADOW NOTHING; there is no existing behaviour to displace.
#   · both are `location =` exact matches, which win over the bottom
#     `location ~ \.php$` regex without touching it.
#   · `lane-preview.sh down` removes the whole snippet, so the deviation lasts
#     exactly as long as the preview does.
# If either file ever IS deployed to the docroot, this conf must go back to the
# convention or it will shadow the real one. That is the trade being made, and
# it is written here so the next person meets it rather than discovers it.
#
# ⚠️ fastcgi.conf, NOT snippets/fastcgi-php.conf — the latter carries
# `try_files $fastcgi_script_name =404` resolved against the SERVER document
# root, where these paths do not exist. It would 404 before fastcgi_pass, so PHP
# is never invoked and the location looks like it never matched.
#
# ⚠️ SCRIPT_FILENAME IS SET AFTER THE INCLUDE, deliberately: fastcgi.conf derives
# it from $document_root$fastcgi_script_name and the later assignment wins.
#
# GATED FOR FREE. The dev2 server block runs the loothdev authorization check at
# SERVER level, so every location here inherits it. Not a new anonymous surface —
# which matters more than usual, because one of these endpoints accepts a POST
# that wakes keeper.
#
# NO NEW FPM POOL AND NOTHING RE-POINTED. php8.3-fpm-looth-dev is a runtime, not
# a checkout; it takes its target from SCRIPT_FILENAME per request. Verified the
# pool user can read the worktree copies:
#   sudo -u looth-dev test -r /home/ubuntu/worktrees/202-web-decision-box/webroot/lanes-decide.php

# The rendered page itself, written by tools/preview/202-decision-preview.sh.
location ^~ /preview/202-web-decision-box/ {
    alias /home/ubuntu/worktrees/202-web-decision-box/.preview/;
    index index.html;
    add_header Cache-Control "no-store" always;
}

location = /lanes-decisions.php {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/202-web-decision-box/webroot/lanes-decisions.php;
    fastcgi_param QUERY_STRING $args;
    add_header Cache-Control "no-store" always;
}

location = /lanes-decide.php {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/202-web-decision-box/webroot/lanes-decide.php;
    fastcgi_param QUERY_STRING $args;
    add_header Cache-Control "no-store" always;
}
