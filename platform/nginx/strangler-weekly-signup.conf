# ===== strangler-weekly-signup — /weekly-email-sign-up/ served standalone =====
# Deployed as /etc/nginx/snippets/strangler-weekly-signup.conf, a SYMLINK into the
# SERVING CHECKOUT (~/loothplatformv2-clean), never into a worktree — keeper's finding
# from the shop-planner deploy, where the snippet pointed at that lane's worktree and
# would have broken the moment the worktree changed. A `git pull` updates the CONTENT
# of an existing snippet; a NEW snippet still needs its symlink created and nginx
# reloaded. See docs/runbooks/deploy-symlink-couplings.md.
#
# WHY: the slug was rendering through `twentytwentyfive`, the stock WordPress theme
# (Ian, 2026-07-31: "Its still rendering it with the wordpress template. Why? I asked
# it not to do that like a hundred times."). This routes it to a standalone front
# controller BEFORE WordPress ever sees the request.
#
# ⚠️ THE URL MUST NOT MOVE. Ian: "I need the url to remain the same." It is in sent
# emails and in members' saved links. tools/gates/weekly-signup-url-gate.sh asserts the
# exact path, NO redirect, and the signup form actually present in the payload — a 200
# is not a page. Run it before and after; run it with LG_WS_EXPECT_STANDALONE=1 to
# assert the theme is GONE, which is the half a presence-check cannot see.
#
# ROLLBACK: comment out the include in dev2.loothgroup.com.conf and reload. The slug
# falls straight back to the WordPress render of page 68595, which is untouched and
# still published. That is the whole reason 68595 must not be edited or unpublished.

# --- The page. -----------------------------------------------------------------
# ^~ (prefix-with-caret) is LOAD-BEARING: a regex location outranks a plain prefix one,
# so the vhost's `location ~* \.(…|css|js|…)$` asset regex would otherwise win for
# anything under this path and try to serve it as a static file. Box trap 6.
#
# THE TRAILING SLASH IS EQUALLY DELIBERATE, and here it does a second job. Without it,
# `^~ /weekly-email-sign-up` would also swallow the BARE form — and the bare form is
# currently 301'd to the slashed one BY WORDPRESS (measured on dev2 AND live,
# 2026-07-31). Letting it fall through preserves that 301 exactly as it is today
# instead of reimplementing it, so this conversion adds NO redirect of its own.
location ^~ /weekly-email-sign-up/ {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;

    # fastcgi.conf derives SCRIPT_FILENAME from $fastcgi_script_name, which for this
    # location is the REQUEST path (…/weekly-email-sign-up/), not a file. Pin both to
    # the real controller — same override pattern as strangler-shop-planner.conf.
    fastcgi_param SCRIPT_FILENAME $document_root/weekly-email-sign-up.php;
    fastcgi_param SCRIPT_NAME     /weekly-email-sign-up.php;
    fastcgi_param QUERY_STRING    $args;

    fastcgi_read_timeout 60;
}
