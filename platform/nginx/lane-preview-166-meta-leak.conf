# ─── LANE PREVIEW — 166-meta-leak ────────────────────────────────────────────
# A URL that serves THIS BRANCH's /u/ and /p/ on the vhost Ian is already signed
# into. Installed and removed by tools/preview/lane-preview.sh — do not hand-copy
# this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/166-meta-leak/u/<slug>/    profile, this branch
#   https://dev2.loothgroup.com/preview/166-meta-leak/p/<slug>/    practice, this branch
#
# WHY IT EXISTS HERE. /u/ and /p/ are symlinked out of ~/loothplatformv2-clean,
# which serves MAIN. So a fetch of /u/<slug> on dev2 renders the LEAKING code no
# matter what is committed on this branch, and a lane that "verified the fix on
# dev2" without this would have verified main and called it green. That is the
# single most likely way this lane could have shipped a false pass, so the gate
# points at these paths rather than at the bare ones.
#
# ⚠️ NAMED CAPTURES, NOT $1. The dev-gate `map` is evaluated lazily and resets
# $1-$9 before fastcgi params are built — the capture-clobber that 404'd every
# /u/ profile on dev2 on 8/20. Every capture below is named.
#
# NO FLAG PARAMS, DELIBERATELY. This fix ships unflagged (Ian, 8/20): it strictly
# REMOVES exposure and adds no state, so there is no OFF leg to compare against —
# the control for this change is MAIN, which is what the unprefixed /u/ and /p/
# on this same box already serve. That comparison is the whole point:
#
#   /u/<slug>/                     → main  → one-liner in the head   (the defect)
#   /preview/166-meta-leak/u/<slug>/ → this → generic in the head    (the fix)
#
# GATED FOR FREE. The dev2 server block runs `if ($loothdev_is_authorized = 0)
# { return 403; }` at SERVER level and every location here inherits it. This adds
# no unauthenticated surface. Loopback is authorized, which is how the gate and
# the red-first script reach these paths COOKIELESS — authorized by origin, but
# carrying no WP session, which is exactly a crawler's view.
#
# ⚠️ THESE PATHS ARE no-store AND noindex-BY-ABSENCE-OF-LINKS, but they render a
# real profile page whose canonical points at the REAL url. Do not link them
# publicly; they exist for Ian and for the gate.

location = /preview/166-meta-leak/ {
    return 302 /preview/166-meta-leak/u/anthony-lattanze/;
}

# A profile on this branch. The members-only case must show a GENERIC description
# in the head; a public-header member must still show their real one-liner.
location ~ "^/preview/166-meta-leak/u/(?<lg166_slug>[\w\-]+)/?$" {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/166-meta-leak/profile-app/web/u.php;
    fastcgi_param QUERY_STRING    slug=$lg166_slug&$args;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "166-meta-leak-u" always;
}

# A practice page on this branch — the second instance of the same defect class
# (tagline AND about, under PRACTICE_HEADER_DEFAULT = 'members').
location ~ "^/preview/166-meta-leak/p/(?<lg166_pslug>[\w\-]+)/?$" {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/166-meta-leak/profile-app/web/p.php;
    fastcgi_param QUERY_STRING    slug=$lg166_pslug&$args;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "166-meta-leak-p" always;
}
