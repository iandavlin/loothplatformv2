# ─── LANE PREVIEW — frontend-compose ─────────────────────────────────────────
# A URL Ian can click that serves THIS BRANCH's Hub, on the vhost he is already
# signed into. Installed and removed by tools/preview/lane-preview.sh — do not
# hand-copy this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/frontend-compose/hub/?compose=1
#
# WHY THIS LANE NEEDS ONE AT ALL. Ian ruled the compose entry point is a TYPE
# TOGGLE inside the hub composer, so half the work lives in bb-mirror/web
# (_chrome.php + forums.js). /srv/bb-mirror is a symlink to loothplatformv2-clean,
# so the hub serves MAIN's copy of both files and a branch edit is invisible on
# dev2 — "verified" would mean "I read it". Box trap: a lane verifying on dev2 is
# usually testing main.
#
# Modelled on lane-preview-thread-follow.conf, which is the same shape for the
# same app; read that and account-following's first. Everything they teach applies
# here unchanged:
#
# ⚠️ `^~` IS LOAD-BEARING. The vhost carries `location ~* \.(…|css|js|…)$`, and a
# REGEX location outranks a plain prefix one. Without `^~` the HTML would come
# from the branch while every stylesheet and script was stolen by that regex and
# served from the document root — an unstyled page that reads as "the branch is
# broken" when the branch is fine. Box trap 6.
#
# ⚠️ fastcgi.conf, NOT snippets/fastcgi-php.conf — the latter carries
# `try_files $fastcgi_script_name =404` resolved against the SERVER document root,
# where /preview/<lane>/… does not exist. It 404s before fastcgi_pass, so PHP is
# never invoked and the location looks like it never matched.
#
# GATED FOR FREE. The dev2 server block runs
# `if ($loothdev_is_authorized = 0) { return 403; }` at SERVER level, so every
# location here inherits it. This preview is not a new unauthenticated surface.
#
# NO NEW FPM POOL, NOTHING RE-POINTED. php8.3-fpm-bb-mirror is a runtime, not a
# checkout; it takes its target from SCRIPT_FILENAME per request. Pointing THIS
# location at the worktree changes nothing for /hub/ on the same vhost, which
# keeps serving /srv/bb-mirror -> the serving checkout.

# Bare prefix → the composer open, which is the thing being reviewed.
location = /preview/frontend-compose/ {
    return 302 /preview/frontend-compose/hub/?compose=1;
}

location = /preview/frontend-compose/hub/index.php {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-bb-mirror.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/frontend-compose/bb-mirror/web/index.php;
    # The mount the app must believe it is under, or index.php cannot strip the
    # prefix to route and every internal link would jump back out to the real /hub/.
    fastcgi_param LG_BB_MIRROR_PUBLIC_PATH /preview/frontend-compose/hub;
    fastcgi_param QUERY_STRING $args;
    # NO fastcgi_cache — a preview that served Ian a cached copy of the page he
    # just asked to be re-rendered would waste the one thing this exists for.
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "frontend-compose" always;
}

# Branch assets — forums.js / forums.css and anything else under bb-mirror/web.
# MUST be ^~, and MUST be the longer prefix so it wins over the front controller.
location ^~ /preview/frontend-compose/hub/ {
    alias /home/ubuntu/worktrees/frontend-compose/bb-mirror/web/;
    # A preview must never become a way to execute arbitrary PHP out of a worktree.
    location ~ \.php$ { return 403; }
    try_files $uri /preview/frontend-compose/hub/index.php;
}

# ── THE COMPOSE ROUTE, ARMED FOR THIS PATH ONLY ──────────────────────────────
# The toggle loads /compose/?…&embed=1 in a same-origin iframe, and that route is
# a WordPress mu-plugin whose flag is OFF by default — so inside the preview the
# iframe would 404 and the toggle would look broken for the wrong reason.
#
# LG_FC_PREVIEW is a fastcgi_param, which ONLY an nginx conf can set — never a
# query string, never a header a visitor controls. So the compose route is armed
# here and NOWHERE else: /compose/ on the real vhost stays exactly as flagged, and
# the tracked default in the mu-plugin stays OFF. Same mechanism thread-follow
# used for LG_BB_MIRROR_FOLLOW.
#
# Read from $_SERVER, not getenv() — a recorded box trap: fastcgi_param lands in
# $_SERVER only, so a getenv()-only flag serves OFF on the very preview URL built
# for Ian to click.
location ^~ /preview/frontend-compose/compose/ {
    # fastcgi.conf, NOT snippets/fastcgi-php.conf — the same trap the hub
    # locations above are commented for, and I walked into it anyway on the one
    # location I wrote from scratch. That include carries
    # `try_files $fastcgi_script_name =404` resolved against the SERVER docroot,
    # where /preview/frontend-compose/compose/ does not exist, so nginx 404s
    # before fastcgi_pass and PHP is never invoked. It looks exactly like "the
    # route is flagged off".
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
    fastcgi_param SCRIPT_FILENAME /var/www/dev/index.php;
    fastcgi_param SCRIPT_NAME     /index.php;
    # WordPress routes on REQUEST_URI; hand it the real route so lg_fc_route()
    # sees /compose/ and the query it was given.
    fastcgi_param REQUEST_URI     /compose/?$args;
    fastcgi_param QUERY_STRING    $args;
    fastcgi_param LG_FC_PREVIEW   1;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "frontend-compose-form" always;
}
