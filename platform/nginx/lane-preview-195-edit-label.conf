# ─── LANE PREVIEW — 195-edit-label ───────────────────────────────────────────
# A URL that serves THIS BRANCH's /u/ and /p/ on the vhost Ian is already signed
# into. Installed and removed by tools/preview/lane-preview.sh — do not hand-copy
# this into /etc/nginx.
#
#   https://dev2.loothgroup.com/preview/195-edit-label/u/<slug>/   profile, this branch
#   https://dev2.loothgroup.com/preview/195-edit-label/p/<slug>/   practice, this branch
#
# WHY IT EXISTS HERE. /u/ and /p/ are symlinked out of ~/loothplatformv2-clean,
# which serves MAIN. A fetch of /u/<slug> on dev2 renders main's switcher — still
# reading "Me" — no matter what is committed on this branch. Without this, gate
# 97's §B/§C and every after-shot would be a photograph of main, and the lane
# would report a green about code it never ran. Same trap #166 records one file
# over.
#
# THE COMPARISON IS THE POINT, and it is free on this box:
#
#   /u/<slug>?view=me                       → main  → Public | Member | Me
#   /preview/195-edit-label/u/<slug>?view=me → this → Public | Member | Edit
#
# ⚠️ NAMED CAPTURES, NOT $1. The dev-gate `map` is evaluated lazily and resets
# $1-$9 before fastcgi params are built — the capture-clobber that 404'd every
# /u/ profile on dev2 on 8/20. Every capture below is named.
#
# ⚠️ $args IS LOAD-BEARING HERE IN A WAY IT IS NOT FOR #166. This lane's whole
# subject is the ?view= switch, so QUERY_STRING must carry it through: without
# `&$args` every preview URL renders the default view and the three positions
# could never be told apart. Verified by fetching ?view=me and ?view=member and
# confirming they differ.
#
# NO FLAG PARAMS, DELIBERATELY. #195 ships unflagged (keeper's ruling, 8/22,
# following #166's cosmetic precedent): one word of visible text, no value, no
# behaviour, no new state. There is no OFF leg to pass — the control for this
# change is MAIN, which the unprefixed paths on this same box already serve.
#
# GATED FOR FREE. The dev2 server block runs the dev-gate check at SERVER level
# and every location here inherits it; this adds no unauthenticated surface.
# Loopback is authorized, which is how the gate reaches these paths.
#
# ⚠️ THESE PATHS RENDER A REAL PROFILE whose canonical points at the REAL url.
# no-store, and not to be linked publicly; they exist for Ian and for the gate.

location = /preview/195-edit-label/ {
    return 302 /preview/195-edit-label/u/ian-davlin-the-looth-group?view=me;
}

# The privacy panel — the control Ian named. ?view=me must read "Edit" while the
# link it sits on still says view=me.
location ~ "^/preview/195-edit-label/u/(?<lg195_slug>[\w\-]+)/?$" {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/195-edit-label/profile-app/web/u.php;
    fastcgi_param QUERY_STRING    slug=$lg195_slug&$args;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "195-edit-label-u" always;
}

# The practice page — the second reachable copy of the same switcher, and the one
# whose row ALREADY carries a chip reading "Edit profile". Ian rules on that
# adjacency from the picture; this is the URL the picture is taken from.
location ~ "^/preview/195-edit-label/p/(?<lg195_pslug>[\w\-]+)/?$" {
    include fastcgi.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/195-edit-label/profile-app/web/p.php;
    fastcgi_param QUERY_STRING    slug=$lg195_pslug&$args;
    add_header Cache-Control "no-store" always;
    add_header X-LG-Preview "195-edit-label-p" always;
}
