[membership]
user = membership
group = membership
listen = /run/php/php8.3-fpm-membership.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.max_requests = 500
pm.process_idle_timeout = 5s
request_terminate_timeout = 60s
php_admin_value[error_log] = /var/log/php-fpm/membership-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M
catch_workers_output = yes
env[LG_MEMBERSHIP_ENV] = "dev"
env[LG_MEMBERSHIP_PUBLIC_HOST] = "loothgroup.com"

; LG_FOLLOWING_ROW_TOGGLES — per-row bell/email toggles on Manage Account.
; ON for live, set by Ian 2026-07-31 after looking at the running page.
;
; This line REPLACES the hand-edited /etc/nginx/snippets/strangler-membership.conf
; on live. That file had been a symlink into the serving checkout; setting the flag
; meant breaking the symlink, after which it stopped receiving repo updates and the
; only record of the divergence was a comment inside it. The flag now reads getenv()
; too (membership-pages/lib/following-data.php), so this TRACKED file sets it and the
; snippet symlink is restored. Deploy is one pull. See
; docs/runbooks/live-divergences.md.
env[LG_FOLLOWING_ROW_TOGGLES] = "1"
