[bb-mirror]
user = bb-mirror
group = bb-mirror

listen = /run/php/php8.3-fpm-bb-mirror.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.max_requests = 500
pm.process_idle_timeout = 5s

request_terminate_timeout = 60s

php_admin_value[error_log] = /var/log/php-fpm/bb-mirror-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M

catch_workers_output = yes



env[LG_BB_MIRROR_ENV] = "dev"
env[LG_BB_MIRROR_PUBLIC_HOST] = "loothgroup.com"

; LG_BB_MIRROR_FOLLOW — turns the thread-follow feature ON for live (Ian, 2026-07-31).
; Tracked here so it arrives by PULL, never a hand-edit. Verified on dev2 before live.
; Infra it depends on is all in place on live: forums.topic_follow table, the
; membership PG role, notifications_type_check widened, and the discussion mu-plugins.
env[LG_BB_MIRROR_FOLLOW] = "1"
