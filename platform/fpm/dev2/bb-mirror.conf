[bb-mirror]
user = bb-mirror
group = bb-mirror

listen = /run/php/php8.3-fpm-bb-mirror.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.max_requests = 500
pm.process_idle_timeout = 5s

request_terminate_timeout = 60s

php_admin_value[error_log] = /var/log/php-fpm/bb-mirror-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M

catch_workers_output = yes



env[LG_BB_MIRROR_ENV] = "dev"
env[LG_BB_MIRROR_PUBLIC_HOST] = "dev2.loothgroup.com"

; LG_BB_MIRROR_FOLLOW — turns LG_THREAD_FOLLOW_ENABLED ON for THIS BOX ONLY.
; Ian, 2026-07-31: "we wernt looking at bucks preview. Every happened on the regular
; url." So the follow feature is ON at the normal dev2 URL for testing, while the flag
; defaults OFF in code (bb-mirror/config.php:461) — which is what keeps it dark on live
; even when main is deployed. platform/fpm/live/bb-mirror.conf deliberately omits it.
;
; This line replaces a hand-edited /etc/php/8.3/fpm/pool.d/bb-mirror.conf on dev2 —
; a real file that had displaced the tracked symlink and so no longer received repo
; updates. Same divergence class as LG_FOLLOWING_ROW_TOGGLES; the code already read
; getenv() here, so nothing but the pool file needed to change.
env[LG_BB_MIRROR_FOLLOW] = "1"
