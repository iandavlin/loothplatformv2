[membership]
user = membership
group = membership
listen = /run/php/php8.3-fpm-membership.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 6
pm.max_requests = 500
pm.process_idle_timeout = 5s
request_terminate_timeout = 60s
php_admin_value[error_log] = /var/log/php-fpm/membership-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M
catch_workers_output = yes
env[LG_MEMBERSHIP_ENV] = "dev"
env[LG_MEMBERSHIP_PUBLIC_HOST] = "dev2.loothgroup.com"

; LG_FOLLOWING_ROW_TOGGLES — per-row bell/email toggles on Manage Account.
; ON for dev2. Replaces the hand-edited /etc/nginx/snippets/strangler-membership.conf
; here exactly as it does on live; dev2 carried the same divergence, older, and it had
; never been recorded. See docs/runbooks/live-divergences.md.
env[LG_FOLLOWING_ROW_TOGGLES] = "1"
