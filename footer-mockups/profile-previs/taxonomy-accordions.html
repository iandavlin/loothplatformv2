<!doctype html>
<!-- PROFILE-POLISH PREVIS (B): TAXONOMY ACCORDIONS — static pictures only, nothing ships from here.
     Drive with URL params:
       ?variant=rows1|rows2 & state=collapsed|expanded & theme=light|dark
     Desktop shoots at 1280, mobile at 390 (see shoot.sh — dev1 google-chrome, serial).
     /u/ chip sections (Instruments / Skills / Music) collapse past a row threshold with a
     "Show all N" toggle chip. TWO threshold variants for Ian's pick (keeper 7/25 23:29):
       rows1 = collapse after ONE visible row      rows2 = collapse after TWO visible rows
     Collapse is measured in ROWS (responsive), not chip count — the same section collapses
     harder at 390 than at 1280. Worth-it guard: if collapsing would hide fewer than 3 chips,
     the section stays flat (no toggle) — Music at desktop width demonstrates this.
     Expanded state is variant-independent: all chips + "Show fewer". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>profile previs — taxonomy accordions</title>
<style>
  :root{
    --lg-cream:#fbfbf8; --lg-card-bg:#fff; --lg-ink:#323532; --lg-mute:#6b6f6b;
    --lg-line:#e3ddd0; --lg-sage:#87986a; --lg-sage-d:#6b7c52; --lg-sage-3:#d4e0b8;
    --lg-sage-tint:#eef2e3; --lg-charcoal:#1a1d1a; --lg-amber:#ecb351; --lg-rust:#c66845;
    --lg-font-serif:"Lora",Georgia,serif;
    --lg-font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  html[data-lguser-theme="dark"]{
    --lg-cream:#15171a; --lg-card-bg:#1e2124; --lg-ink:#e5e7e1; --lg-mute:#a6ac9f;
    --lg-line:#2c312d; --lg-sage:#9cb37d; --lg-sage-d:#b0c693; --lg-sage-3:#4a5a40;
    --lg-sage-tint:#243024; --lg-charcoal:#f2f4ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--lg-cream);color:var(--lg-ink);font:15px/1.6 var(--lg-font-sans);-webkit-font-smoothing:antialiased}

  .site-hd{height:58px;border-bottom:1px solid var(--lg-line);display:flex;align-items:center;gap:26px;padding:0 32px;background:var(--lg-cream)}
  .brand{display:flex;align-items:center;gap:9px;font:700 18px/1 var(--lg-font-serif);color:var(--lg-charcoal)}
  .brand .mk{width:26px;height:26px;border-radius:50%;background:var(--lg-sage);display:inline-block}
  .nav{display:flex;gap:20px;font:600 13.5px/1 var(--lg-font-sans);color:var(--lg-mute)}
  .nav .on{color:var(--lg-charcoal)}
  .hd-sp{flex:1}
  .hd-pill{width:30px;height:30px;border-radius:50%;background:var(--lg-sage-tint)}
  .hd-burger{display:none;font:400 22px/1 var(--lg-font-sans);color:var(--lg-ink)}
  @media (max-width:560px){
    .site-hd{padding:0 16px;gap:14px}
    .nav{display:none}
    .hd-burger{display:block}
  }

  .lg-shell{display:flex;flex-direction:column;gap:20px;max-width:760px;margin:0 auto;padding:24px 20px 48px}
  .lg-block{position:relative;background:var(--lg-card-bg);border:1px solid var(--lg-line);border-radius:16px;padding:22px 24px;margin:0}
  .lg-bh{margin:0 0 12px;font:800 16px/1 var(--lg-font-serif);color:var(--lg-charcoal)}

  .lg-idrow{display:flex;align-items:center;gap:16px}
  .lg-idrow__pic{width:72px;height:72px;border-radius:16px;flex:none;background:var(--lg-sage);color:#fff;display:grid;place-items:center;font:700 26px/1 var(--lg-font-serif)}
  html[data-lguser-theme="dark"] .lg-idrow__pic{color:#15171a}
  .lg-idrow__name{margin:0;font:800 24px/1.1 var(--lg-font-serif);color:var(--lg-charcoal)}
  .lg-idrow__tag{margin:5px 0 0;font:500 13.5px/1.4 var(--lg-font-sans);color:var(--lg-mute)}

  /* chips — real /u/ rules (u.php .lg-chips/.lg-chip) */
  .lg-chips{display:flex;flex-wrap:wrap;gap:0}
  .lg-chip{display:inline-block;background:var(--lg-cream);border:1px solid var(--lg-line);border-radius:8px;padding:5px 12px;margin:0 7px 8px 0;font-size:13.5px}
  .lg-chip.is-cut{display:none}

  /* NEW: the accordion toggle — chip-shaped, sage-tinted so it never reads as data */
  .lg-chip--more{background:var(--lg-sage-tint);border-color:var(--lg-sage-3);color:var(--lg-sage-d);font:700 12.5px/1.55 var(--lg-font-sans);cursor:pointer}
  .lg-chip--more .car{font-size:10px;margin-left:5px}

  .note{max-width:760px;margin:0 auto;padding:0 20px 40px;font:500 12.5px/1.55 var(--lg-font-sans);color:var(--lg-mute)}
  .note b{color:var(--lg-ink)}
  .stamp{position:fixed;top:8px;right:10px;z-index:1200;font:700 11px/1 var(--lg-font-sans);letter-spacing:.03em;color:var(--lg-mute);background:var(--lg-card-bg);border:1px solid var(--lg-line);border-radius:7px;padding:6px 9px}
  @media (max-width:560px){.stamp{top:auto;bottom:8px}}
</style>
</head>
<body>
  <div class="stamp" id="stamp">PREVIS</div>

  <div class="site-hd">
    <span class="brand"><span class="mk"></span>Looth Group</span>
    <nav class="nav"><span class="on">The Hub</span><span>Events</span><span>The Map</span><span>Sponsors</span><span>Loothtool</span></nav>
    <span class="hd-sp"></span><span class="hd-burger">≡</span><span class="hd-pill"></span>
  </div>

  <div class="lg-shell">
    <section class="lg-block">
      <div class="lg-idrow">
        <span class="lg-idrow__pic">DP</span>
        <div>
          <h1 class="lg-idrow__name">Doug Proper</h1>
          <p class="lg-idrow__tag">Archtop builder &amp; repair — Guitar Specialist, Inc. · Bedford Hills, NY</p>
        </div>
      </div>
    </section>

    <section class="lg-block"><h3 class="lg-bh">Instruments</h3><div class="lg-chips" data-acc id="c-inst"></div></section>
    <section class="lg-block"><h3 class="lg-bh">Skills</h3><div class="lg-chips" data-acc id="c-skill"></div></section>
    <section class="lg-block"><h3 class="lg-bh">Music</h3><div class="lg-chips" data-acc id="c-music"></div></section>
  </div>

  <div class="note" id="note"></div>

  <script>
    // Real catalog shapes: a heavy tagger (both surfaces overflow), and a light one
    // (Music) that stays UNDER threshold at desktop width — shows the worth-it guard.
    const SETS = {
      'c-inst':  ['Archtop guitar','Flat-top steel-string','Classical / nylon','Electric solid-body','Semi-hollow',
                  'Bass guitar','Mandolin','Ukulele','Banjo','Resonator','Lap steel','Violin family','Cello',
                  'Double bass','Harp guitar','Weissenborn'],
      'c-skill': ['Fret work','Refretting','Setups','Nut & saddle','Neck resets','Crack repair','Brace repair',
                  'Bridge reglue','French polish','Nitro finishing','UV-cure finishing','Binding & purfling',
                  'Inlay & engraving','Headstock repair','Structural restoration','Electronics & wiring',
                  'Pickup winding','CNC & CAD','3D printing'],
      'c-music': ['Jazz','Blues','Bluegrass','Classical','Folk','Rockabilly'],
    };
    const q = new URLSearchParams(location.search);
    const variant = q.get('variant') || 'rows1';        // rows1|rows2
    const state   = q.get('state')   || 'collapsed';    // collapsed|expanded
    const theme   = q.get('theme')   || 'light';
    document.documentElement.setAttribute('data-lguser-theme', theme);
    const MAXROWS = variant === 'rows2' ? 2 : 1;
    const MIN_HIDDEN = 3;                               // worth-it guard

    for (const id in SETS)
      document.getElementById(id).innerHTML = SETS[id].map(n => '<span class="lg-chip">' + n + '</span>').join('');

    // The real build would do exactly this measure-and-cut: rows are groups of equal
    // offsetTop; hide past-threshold chips, then trim until the toggle FITS on the
    // last visible row (never let "Show all N" wrap onto its own lonely row).
    // Re-runs on resize — row counts are width-dependent, so the real build needs
    // this too (also: headless chrome clamps windows to 500px wide at load, then
    // relayouts to the real 390 at shot time; without the resize re-run the 390
    // frames ship a 500px-measured cut).
    function collapse(wrap) {
      const chips = Array.prototype.slice.call(wrap.querySelectorAll('.lg-chip'));
      if (!chips.length) return;
      const tops = chips.map(c => c.offsetTop).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b);
      const total = chips.length;

      if (state === 'expanded') {
        if (tops.length <= MAXROWS) return;             // never collapsible → no toggle at all
        const btn = document.createElement('button');
        btn.className = 'lg-chip lg-chip--more';
        btn.innerHTML = 'Show fewer<span class="car">▲</span>';
        wrap.appendChild(btn);
        return;
      }

      if (tops.length <= MAXROWS) return;               // fits → flat section
      const limitTop = tops[MAXROWS - 1];
      let hidden = 0;
      chips.forEach(c => { if (c.offsetTop > limitTop) { c.classList.add('is-cut'); hidden++; } });

      const btn = document.createElement('button');
      btn.className = 'lg-chip lg-chip--more';
      btn.innerHTML = 'Show all ' + total + '<span class="car">▼</span>';
      wrap.appendChild(btn);

      let guard = 0;                                    // trim until the toggle fits the last row
      while (btn.offsetTop > limitTop && guard++ < 60) {
        const vis = chips.filter(c => !c.classList.contains('is-cut'));
        if (!vis.length) break;
        vis[vis.length - 1].classList.add('is-cut'); hidden++;
      }
      if (hidden < MIN_HIDDEN) {                        // not worth a toggle for 1–2 chips
        chips.forEach(c => c.classList.remove('is-cut'));
        btn.remove();
      }
    }
    function applyAll() {
      document.querySelectorAll('[data-acc]').forEach(wrap => {
        wrap.querySelectorAll('.lg-chip--more').forEach(b => b.remove());
        wrap.querySelectorAll('.lg-chip.is-cut').forEach(c => c.classList.remove('is-cut'));
        collapse(wrap);
      });
    }
    applyAll();
    addEventListener('resize', applyAll);
    let lastW = innerWidth;   // headless shoot: the 500→390 relayout may skip 'resize'
    setInterval(() => { if (innerWidth !== lastW) { lastW = innerWidth; applyAll(); } }, 100);

    const NOTES = {
      collapsed: '<b>Variant ' + (MAXROWS === 1 ? 'A — collapse after 1 row' : 'B — collapse after 2 rows') + '</b> · threshold is measured in <b>rows</b> (responsive: the same section cuts harder at 390 than at 1280). The toggle is a sage-tinted chip — “Show all N”, N = full count — and always sits at the end of the last visible row, never on its own row. <b>Worth-it guard</b>: hiding fewer than 3 chips isn’t worth a toggle — Music stays flat at desktop width. Edit mode (owner) never collapses.',
      expanded:  '<b>Expanded</b> (variant-independent) — all chips + “Show fewer”. Sections that never collapse (Music at desktop) get no toggle at all.',
    };
    document.getElementById('note').innerHTML = NOTES[state] || '';
    document.getElementById('stamp').textContent = 'PREVIS · accordion · ' + (state === 'expanded' ? 'expanded' : variant) + ' · ' + theme;
  </script>
</body>
</html>
