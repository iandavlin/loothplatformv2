# TEMPORARY lane listener — account-following (2026-07-30).
#
# WHY THIS EXISTS. /manage-subscription/ is served from /srv/membership-pages,
# which symlinks into ~/loothplatformv2-clean — i.e. MAIN. A lane that "verifies
# on dev2" without this is measuring main's render and would false-PASS a branch
# that never shipped. This server block is ADDITIVE: it binds its own loopback
# port and points ONLY the membership front controller at the lane worktree.
# Nothing on :443 changes.
#
# server_name matches dev2 and it carries the same cert on purpose: cookies
# ignore the port, so a browser already holding the dev gate cookie and the WP
# session sends both here, and the page authenticates as the real member.
#
# /bb-mirror-api/ is included UNMODIFIED from the deployed snippet — the lane is
# a consumer of thread-follow's contract and must be tested against the endpoint
# that is actually running, not a copy of it.
#
# REMOVE WHEN THE LANE MERGES:
#   sudo rm /etc/nginx/sites-enabled/lane-account-following.conf && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 127.0.0.1:8930 ssl;
    server_name dev2.loothgroup.com;

    ssl_certificate     /etc/letsencrypt/live/dev2.loothgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev2.loothgroup.com/privkey.pem;

    access_log /var/log/nginx/lane-account-following.access.log;
    error_log  /var/log/nginx/lane-account-following.error.log;

    root /var/www/dev;

    include /etc/nginx/snippets/loothdev-tokens.conf;

    # static assets for the membership surface — served from THE LANE WORKTREE
    location ^~ /membership-pages/ {
        alias /home/ubuntu/worktrees/account-following/membership-pages/web/;
        location ~ \.php$ { return 403; }
        try_files $uri =404;
    }

    # the membership front controller — THE LANE WORKTREE's router.php
    location ~ ^/(manage-subscription)(?:/.*)?$ {
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-membership.sock;
        fastcgi_param SCRIPT_FILENAME /home/ubuntu/worktrees/account-following/membership-pages/web/router.php;
        fastcgi_param LG_MS_SLUG $1;
        fastcgi_param QUERY_STRING $args;
    }

    # the follow endpoint, exactly as deployed
    include /etc/nginx/snippets/strangler-bb-mirror.conf;
}
