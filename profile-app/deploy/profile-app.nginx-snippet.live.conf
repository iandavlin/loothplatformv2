# profile-app nginx snippet — LIVE.
#
# !! STALE ARTIFACT (verified 2026-07-29) — THIS FILE IS NOT WHAT LIVE LOADS. !!
# Live's server block includes /etc/nginx/snippets/strangler-profile-app.conf,
# a symlink to platform/nginx/strangler-profile-app.conf, and that is where the
# real routes live. The path below (/etc/nginx/snippets/profile-app.conf) does
# not exist on live. Kept in sync so it is not actively wrong if anyone revives
# it, but edit platform/nginx/strangler-profile-app.conf for anything real.
#
# Inserted on live via:
#   /etc/nginx/snippets/profile-app.conf  (this file)
#   then `include snippets/profile-app.conf;` inside loothgroup.com's
#   SSL server block, ABOVE the catch-all `location /` for WP.
#
# Differences from dev:
#   - No cookie gate ($loothdev_is_authorized doesn't exist on live).
#   - Read endpoint is currently open (slice zero — auth comes in slice one).

    location ^~ /profile-api/v0/ {
        alias /srv/profile-app/api/v0/;

        rewrite "^/profile-api/v0/hooks/user-created/?$"        /profile-api/v0/user-created.php last;
        rewrite "^/profile-api/v0/hooks/email-changed/?$"       /profile-api/v0/internal-email-changed.php last;
        rewrite "^/profile-api/v0/user/([0-9a-fA-F-]{36})/?$"   /profile-api/v0/user.php?uuid=$1 last;

        # Webhook — loopback only.
        location = /profile-api/v0/user-created.php {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }

        # Webhook — loopback only. WP email-change receiver (audit §5). This route
        # MUST ship in the same window as profile-sync.php's profile_update hook:
        # the hook POSTs here, and without this block live returns 404 and the
        # member's profile-app primary_email silently stays stale — the exact bug
        # the hook exists to fix.
        location = /profile-api/v0/internal-email-changed.php {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }

        # Read — open (slice zero).
        location = /profile-api/v0/user.php {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm-profile-app.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }

        location ~ \.php$ { return 403; }
    }
